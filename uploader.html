<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>アップローダー統合ファイル一覧</title>
<style>
:root { color-scheme: light; }

body {
  margin: 0;
  background: #f5f6f8;
  color: #202124;
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
}

main {
  max-width: 1400px;
  margin: 0 auto;
  padding: 28px 20px 48px;
}

h1 {
  font-size: clamp(23px, 3vw, 32px);
  margin: 0 0 8px;
}

.description {
  color: #606770;
  margin: 0 0 22px;
}

.controls {
  display: grid;
  grid-template-columns: minmax(220px, 1fr) minmax(190px, 240px);
  gap: 10px;
  margin-bottom: 10px;
}

input, select {
  width: 100%;
  box-sizing: border-box;
  padding: 11px 12px;
  font: inherit;
  border: 1px solid #c8ccd0;
  border-radius: 8px;
  background: white;
}

.status {
  color: #5f6368;
  font-size: 14px;
  margin: 10px 0;
}

.table-wrap {
  overflow: auto;
  border: 1px solid #dadce0;
  border-radius: 10px;
  background: white;
}

table {
  border-collapse: collapse;
  width: 100%;
  min-width: 1000px;
  table-layout: fixed;
}

th, td {
  box-sizing: border-box;
  text-align: left;
  padding: 11px 12px;
  border-bottom: 1px solid #e8eaed;
  vertical-align: top;
}

th {
  position: sticky;
  top: 0;
  background: #eef0f3;
  white-space: nowrap;
}

/* 一覧列だけ非表示。絞り込み機能は維持 */
th.group-column,
td.group-column {
  display: none;
}

/* 列幅を固定 */
col.group-col {
  width: 0;
}

col.page-col {
  width: 190px;
}

col.name-col {
  width: 300px;
}

col.comment-col {
  width: auto;
}

col.date-col {
  width: 145px;
}

th.sortable {
  cursor: pointer;
  user-select: none;
}

th.sortable:hover {
  background: #dfe4eb;
}

.sort-icon {
  display: inline-block;
  margin-left: 4px;
  color: #075db5;
}

tbody tr:hover {
  background: #f8faff;
}

td.name {
  overflow-wrap: anywhere;
}

td.comment {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

td.page {
  overflow-wrap: anywhere;
}

td.date {
  white-space: nowrap;
  font-size: 13px;
  color: #606770;
}

a {
  color: #075db5;
  text-decoration: none;
}

a:hover {
  text-decoration: underline;
}

@media (max-width: 650px) {
  main {
    padding: 18px 10px 32px;
  }

  .controls {
    grid-template-columns: 1fr;
  }
}
</style>
</head>
<body>
<main>
<h1>アップローダー統合ファイル一覧</h1>

<p class="description">
  3つの一覧データをまとめて検索できます。
  一覧とページタイトルで絞り込み、ファイル名をクリックすると元のリンクを開きます。
  日時の見出しをクリックすると昇順・降順を切り替えられます。
</p>

<div class="controls">
  <input
    id="search"
    type="search"
    placeholder="ファイル名・コメント・ページ名で検索"
  >

  <select id="group">
    <option value="">すべての一覧</option>
    <option value="凶悪キャラスレアップローダ">凶悪キャラスレアップローダ</option>
    <option value="ターゲット倉庫">ターゲット倉庫</option>
    <option value="むげん代理公開場">むげん代理公開場</option>
  </select>

  <select id="page">
    <option value="">すべてのページ</option>
  </select>
</div>

<div class="status" id="status">読み込み中...</div>

<div class="table-wrap">
<table>
<colgroup>
  <col class="group-col">
  <col class="page-col">
  <col class="name-col">
  <col class="comment-col">
  <col class="date-col">
</colgroup>
<thead>
<tr>
  <th class="group-column">一覧</th>
  <th>ページ</th>
  <th>ファイル名</th>
  <th>コメント</th>
  <th
    id="dateSort"
    class="sortable"
    aria-label="日時で並べ替え"
    aria-sort="descending"
    title="クリックで日時の昇順・降順を切り替え"
  >
    日時<span id="dateSortIcon" class="sort-icon">▼</span>
  </th>
</tr>
</thead>
<tbody id="rows"></tbody>
</table>
</div>
</main>

<script>
let allItems = [];

// 初期状態は日時の降順（新しい順）
let dateSortOrder = "desc";

const search = document.getElementById("search");
const group = document.getElementById("group");
const page = document.getElementById("page");
const statusEl = document.getElementById("status");
const tbody = document.getElementById("rows");
const dateSort = document.getElementById("dateSort");
const dateSortIcon = document.getElementById("dateSortIcon");

// 日時文字列を比較用の数値に変換
// 対応例：26/10/10 12:10
function parseDate(value) {
  if (!value) return null;

  const match = String(value).trim().match(
    /^(\d{2})\/(\d{1,2})\/(\d{1,2})\s+(\d{1,2}):(\d{2})$/
  );

  if (!match) return null;

  const [, yy, mm, dd, hh, min] = match;

  const year = Number(yy) >= 70
    ? 1900 + Number(yy)
    : 2000 + Number(yy);

  const month = Number(mm);
  const day = Number(dd);
  const hour = Number(hh);
  const minute = Number(min);

  const timestamp = new Date(
    year, month - 1, day, hour, minute
  ).getTime();

  return Number.isNaN(timestamp) ? null : timestamp;
}

// 日時の見出しをクリックして並べ替え方向を切り替え
dateSort.addEventListener("click", () => {
  dateSortOrder = dateSortOrder === "desc" ? "asc" : "desc";

  dateSortIcon.textContent =
    dateSortOrder === "desc" ? "▼" : "▲";

  dateSort.setAttribute(
    "aria-sort",
    dateSortOrder === "desc" ? "descending" : "ascending"
  );

  render();
});

// 一覧の選択に応じてページタイトルの選択肢を更新
function updatePages() {
  const selectedGroup = group.value;
  const previousPage = page.value;

  const groupOrder = [
    "凶悪キャラスレアップローダ",
    "ターゲット倉庫",
    "むげん代理公開場"
  ];

  function getPageNumber(name) {
    const match = name.match(/(\d+)\s*(?:\||$)/);
    if (match) return Number(match[1]);

    const fallback = name.match(/(\d+)/);
    return fallback ? Number(fallback[1]) : null;
  }

  function comparePages(a, b) {
    const numA = getPageNumber(a);
    const numB = getPageNumber(b);

    if (numA === null && numB !== null) return -1;
    if (numA !== null && numB === null) return 1;

    if (numA !== null && numB !== null && numA !== numB) {
      return numA - numB;
    }

    return a.localeCompare(b, "ja");
  }

  const pages = [...new Set(
    allItems
      .filter(x => !selectedGroup || x.group === selectedGroup)
      .map(x => x.page || "")
      .filter(Boolean)
  )].sort((a, b) => {
    // 「すべての一覧」のときだけ一覧の優先順を適用
    if (!selectedGroup) {
      const groupA = groupOrder.findIndex(g =>
        allItems.some(x => x.group === g && x.page === a)
      );

      const groupB = groupOrder.findIndex(g =>
        allItems.some(x => x.group === g && x.page === b)
      );

      if (groupA !== groupB) {
        return (groupA === -1 ? Infinity : groupA) -
               (groupB === -1 ? Infinity : groupB);
      }
    }

    return comparePages(a, b);
  });

  page.replaceChildren();

  const allOption = document.createElement("option");
  allOption.value = "";
  allOption.textContent = "すべてのページ";
  page.appendChild(allOption);

  for (const pageName of pages) {
    const option = document.createElement("option");
    option.value = pageName;
    option.textContent = pageName;
    page.appendChild(option);
  }

  // 前のページが現在の一覧にも存在する場合は選択を維持
  if (pages.includes(previousPage)) {
    page.value = previousPage;
  } else {
    page.value = "";
  }
}

// 条件に一致するデータを表示
function render() {
  const q = search.value.trim().toLocaleLowerCase();
  const selectedGroup = group.value;
  const selectedPage = page.value;

  const filtered = allItems.filter(x => {
    const matchesGroup =
      !selectedGroup || x.group === selectedGroup;

    const matchesPage =
      !selectedPage || x.page === selectedPage;

    const matchesSearch =
      [x.name, x.comment, x.page, x.group].some(v =>
        (v || "").toLocaleLowerCase().includes(q)
      );

    return matchesGroup && matchesPage && matchesSearch;
  });

  // 日時で並べ替え。日時が空欄・形式不明の行は末尾に配置
  filtered.sort((a, b) => {
    const dateA = parseDate(a.date);
    const dateB = parseDate(b.date);

    if (dateA === null && dateB === null) return 0;
    if (dateA === null) return 1;
    if (dateB === null) return -1;

    return dateSortOrder === "asc"
      ? dateA - dateB
      : dateB - dateA;
  });

  statusEl.textContent =
    `${filtered.length.toLocaleString()} 件 / 全 ${allItems.length.toLocaleString()} 件`;

  tbody.replaceChildren();
  const frag = document.createDocumentFragment();

  for (const x of filtered) {
    const tr = document.createElement("tr");

    // 一覧名：列は非表示だが、絞り込み用データは維持
    const groupTd = document.createElement("td");
    groupTd.className = "group-column";
    groupTd.textContent = x.group || "";
    tr.appendChild(groupTd);

    // ページタイトル
    const pageTd = document.createElement("td");
    pageTd.className = "page";
    pageTd.textContent = x.page || "";
    tr.appendChild(pageTd);

    // ファイル名（クリックすると元のリンクを開く）
    const nameTd = document.createElement("td");
    nameTd.className = "name";

    if (x.url) {
      const a = document.createElement("a");
      a.href = x.url;
      a.textContent = x.name || x.url;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      nameTd.appendChild(a);
    } else {
      nameTd.textContent = x.name || "";
    }

    tr.appendChild(nameTd);

    // コメント
    const commentTd = document.createElement("td");
    commentTd.className = "comment";
    commentTd.textContent = x.comment || "";
    tr.appendChild(commentTd);

    // 日時
    const dateTd = document.createElement("td");
    dateTd.className = "date";
    dateTd.textContent = x.date || "";
    tr.appendChild(dateTd);

    frag.appendChild(tr);
  }

  tbody.appendChild(frag);
}

// イベント設定
search.addEventListener("input", render);

group.addEventListener("change", () => {
  updatePages();
  render();
});

page.addEventListener("change", render);

// data.json を読み込む
fetch("data.json")
  .then(r => {
    if (!r.ok) {
      throw new Error("data.json を取得できません");
    }
    return r.json();
  })
  .then(data => {
    if (!Array.isArray(data)) {
      throw new Error("data.json の形式が正しくありません");
    }

    allItems = data;
    updatePages();
    render();
  })
  .catch(err => {
    statusEl.textContent =
      "一覧データを読み込めません。data.json が同じフォルダにあるか確認してください。";
    console.error(err);
  });
</script>
</body>
</html>
