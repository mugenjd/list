
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#b71c1c">
<title>YouTube動画検索</title>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<style>
:root {
  color-scheme: light;
  --primary: #c62828;
  --primary-dark: #8e0000;
  --primary-deep: #7f0000;
  --primary-light: #ffebee;
  --primary-border: #f0caca;
  --text: #3f2525;
  --muted: #795c5c;
  --border: #f0dada;
  --background: #fff7f7;
  --white: #ffffff;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--background);
  color: var(--text);
  font-family:
    -apple-system, BlinkMacSystemFont,
    "Segoe UI", "Noto Sans JP", sans-serif;
  font-size: 15px;
  line-height: 1.7;
}

/* ヘッダー */
.hero {
  position: relative;
  overflow: hidden;
  padding: 42px 24px 48px;
  color: white;
  background: linear-gradient(
    135deg,
    #7f0000 0%,
    #b71c1c 55%,
    #ef5350 100%
  );
}

.hero::before,
.hero::after {
  content: "";
  position: absolute;
  border-radius: 50%;
  pointer-events: none;
}

.hero::before {
  width: 300px;
  height: 300px;
  top: -190px;
  right: 8%;
  background: rgb(255 255 255 / 9%);
}

.hero::after {
  width: 220px;
  height: 220px;
  bottom: -175px;
  right: 20%;
  background: rgb(255 205 210 / 15%);
}

.hero-inner {
  position: relative;
  z-index: 1;
  max-width: 1400px;
  margin: 0 auto;
}

.back-link {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 18px;
  padding: 6px 12px;
  border: 1px solid rgb(255 255 255 / 35%);
  border-radius: 8px;
  color: #ffebee;
  font-size: 13px;
  text-decoration: none;
  transition: background 0.2s;
}

.back-link:hover {
  color: white;
  background: rgb(255 255 255 / 12%);
}

.eyebrow {
  display: block;
  margin-bottom: 8px;
  color: #ffcdd2;
  font-size: 11px;
  font-weight: bold;
  letter-spacing: 2px;
}

h1 {
  margin: 0;
  font-size: clamp(26px, 4vw, 36px);
  line-height: 1.35;
  letter-spacing: 0.5px;
}

.description {
  margin: 14px 0 0;
  color: #ffebee;
  font-size: 14px;
  line-height: 1.9;
}

/* メインコンテンツ */
main {
  max-width: 1450px;
  margin: 0 auto;
  padding: 30px 24px 48px;
}

.section-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 16px;
}

.section-heading h2 {
  margin: 0;
  font-size: 21px;
}

.section-label {
  color: var(--muted);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 1px;
}

/* 検索・絞り込み */
.filter-panel {
  margin-bottom: 20px;
  padding: 20px;
  border: 1px solid var(--border);
  border-radius: 14px;
  background: var(--white);
  box-shadow: 0 4px 14px rgb(100 0 0 / 4%);
}

.filter-title {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 0 0 14px;
  font-size: 15px;
  font-weight: bold;
}

.filter-icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 30px;
  height: 30px;
  border-radius: 8px;
  background: #ffebee;
  color: var(--primary-dark);
  font-size: 17px;
}

.controls {
  display: grid;
  grid-template-columns:
    minmax(240px, 1fr)
    minmax(220px, 260px)
    minmax(260px, 440px);
  gap: 12px;
}

.control-group {
  min-width: 0;
}

.control-group.full-width {
  grid-column: 1 / -1;
}

.control-label {
  display: block;
  margin-bottom: 6px;
  color: #795454;
  font-size: 12px;
  font-weight: 700;
}

input,
select {
  display: block;
  width: 100%;
  min-width: 0;
  height: 46px;
  padding: 10px 12px;
  border: 1px solid #dfbcbc;
  border-radius: 9px;
  outline: none;
  background: #fff;
  color: var(--text);
  font: inherit;
  font-size: 14px;
  transition: border-color 0.2s, box-shadow 0.2s;
}

input::placeholder {
  color: #b49a9a;
}

input:focus,
select:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgb(198 40 40 / 12%);
}

/* ボタン */
.button-area {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin: 8px 0 22px;
}

button {
  border: none;
  border-radius: 7px;
  padding: 11px 18px;
  cursor: pointer;
  font: inherit;
  font-size: 14px;
  transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
}

button:hover:not(:disabled) {
  transform: translateY(-1px);
}

.primary-button,
.play-button {
  background: var(--primary);
  color: white;
  font-weight: bold;
  box-shadow: 0 3px 8px rgb(198 40 40 / 18%);
}

.primary-button:hover,
.play-button:hover {
  background: var(--primary-dark);
  box-shadow: 0 5px 12px rgb(198 40 40 / 24%);
}

.secondary-button {
  background: #f5e7e7;
  color: #653333;
  border: 1px solid #e4caca;
}

.secondary-button:hover {
  background: #ead4d4;
}

/* 読み込み状態 */
.status {
  margin: 14px 0;
  padding: 13px 16px;
  border-radius: 8px;
  background: #faf5f5;
  border-left: 4px solid #c8a0a0;
  font-size: 14px;
  overflow-wrap: anywhere;
}

.status.error {
  color: #a00000;
  background: #fff0f0;
  border-left-color: #c62828;
}

.status.success {
  color: #256b38;
  background: #effaf1;
  border-left-color: #43a047;
}

/* 検索結果 */
.result-info {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin: 26px 0 18px;
  padding: 0 0 12px;
  border-bottom: 3px solid var(--primary);
}

.result-count {
  font-size: 19px;
  font-weight: bold;
  color: var(--primary-dark);
}

/* 動画カード */
.video-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 22px;
}

.video-card {
  min-width: 0;
  overflow: hidden;
  border: 1px solid #eadada;
  border-radius: 12px;
  background: white;
  display: flex;
  flex-direction: column;
  box-shadow: 0 3px 12px rgb(100 0 0 / 5%);
  transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
}

.video-card:hover {
  transform: translateY(-3px);
  border-color: #dbaaaa;
  box-shadow: 0 8px 20px rgb(100 0 0 / 11%);
}

.thumbnail-link {
  display: block;
  background: #f5eeee;
  aspect-ratio: 16 / 9;
  overflow: hidden;
}

.video-thumbnail {
  display: block;
  width: 100%;
  height: 100%;
  aspect-ratio: 16 / 9;
  object-fit: cover;
  background: #f5eeee;
}

.thumbnail-placeholder {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 100%;
  color: #795454;
  background: #fff0f0;
  font-size: 14px;
}

.video-content {
  padding: 16px;
  display: flex;
  flex-direction: column;
  flex: 1;
}

.video-title {
  display: block;
  color: var(--primary-dark);
  font-size: 17px;
  line-height: 1.6;
  font-weight: bold;
  text-decoration: none;
  overflow-wrap: anywhere;
  margin-bottom: 14px;
}

.video-title:hover {
  color: #e53935;
  text-decoration: underline;
}

.metadata {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 18px;
  font-size: 13px;
}

.metadata-row {
  display: flex;
  align-items: flex-start;
  gap: 8px;
}

.metadata-label {
  flex-shrink: 0;
  font-weight: bold;
  color: #795454;
  padding-top: 4px;
}

.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  min-width: 0;
}

.chip {
  display: inline-block;
  padding: 5px 9px;
  border: 1px solid #e7b2b2;
  border-radius: 6px;
  background: #fff0f0;
  color: #a31616;
  font-size: 12px;
  line-height: 1.5;
  cursor: pointer;
  overflow-wrap: anywhere;
}

.chip:hover {
  background: #ffdada;
  border-color: #d87878;
  transform: none;
}

.tag-chip {
  border-color: #ded2d2;
  background: #f7f3f3;
  color: #574747;
}

.tag-chip:hover {
  background: #eee3e3;
  border-color: #cbb4b4;
}

.play-button {
  width: 100%;
  margin-top: auto;
  padding: 12px;
}

.player-container {
  margin-top: 12px;
}

.player-container iframe {
  display: block;
  width: 100%;
  aspect-ratio: 16 / 9;
  border: none;
  border-radius: 7px;
  background: #000;
}

.close-player-button {
  width: 100%;
  margin-top: 8px;
  background: #5b4545;
  color: white;
}

.close-player-button:hover {
  background: #3e2d2d;
}

.empty-message {
  grid-column: 1 / -1;
  padding: 45px 20px;
  text-align: center;
  color: #795454;
  background: #fffafa;
  border: 1px dashed #dfbaba;
  border-radius: 12px;
}

/* ページネーション */
.pagination {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-items: center;
  gap: 8px;
  margin-top: 30px;
}

.pagination button {
  min-width: 42px;
  background: #fff0f0;
  color: #8e0000;
  border: 1px solid #e7caca;
}

.pagination button:hover:not(:disabled) {
  background: #ffdada;
}

.pagination button.active {
  background: var(--primary);
  color: white;
  border-color: var(--primary);
  font-weight: bold;
  box-shadow: 0 2px 7px rgb(198 40 40 / 20%);
}

.pagination button:disabled {
  opacity: 0.35;
  cursor: not-allowed;
  transform: none;
}

.pagination-info {
  text-align: center;
  color: #806666;
  font-size: 13px;
  margin-top: 12px;
}

a:focus-visible,
button:focus-visible {
  outline: 3px solid #ef9a9a;
  outline-offset: 3px;
}

/* フッター */
footer {
  padding: 20px 12px;
  border-top: 1px solid #f0dada;
  background: #fff;
  color: #a18888;
  font-size: 12px;
  text-align: center;
}

@media (max-width: 1000px) {
  .controls {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .video-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

@media (max-width: 650px) {
  .hero {
    padding: 30px 18px 36px;
  }

  main {
    padding: 24px 12px 32px;
  }

  h1 {
    font-size: 27px;
  }

  .description {
    font-size: 13px;
  }

  .section-heading h2 {
    font-size: 19px;
  }

  .filter-panel {
    padding: 15px;
  }

  .controls {
    grid-template-columns: 1fr;
    gap: 12px;
  }

  .control-group.full-width {
    grid-column: auto;
  }

  input,
  select {
    height: 44px;
  }

  .button-area button {
    flex: 1;
  }

  .result-count {
    font-size: 17px;
  }

  .video-grid {
    grid-template-columns: 1fr;
    gap: 16px;
  }

  .video-content {
    padding: 14px;
  }

  .video-title {
    font-size: 16px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    transition: none !important;
    scroll-behavior: auto !important;
  }
}
</style>
</head>

<body>

<header class="hero">
  <div class="hero-inner">
    <a class="back-link" href="https://mugenjd.github.io/list/index.html">
      <span aria-hidden="true">←</span>
      ページ一覧に戻る
    </a>

    <h1>YouTube動画検索</h1>

    <p class="description">
      キーワードやカテゴリー・クラス・タグで動画を検索・絞り込みできます。<br>
      サムネイルからYouTubeを開いたり、ページ内で動画を再生したりできます。<br>
      検索結果は1ページ最大50件です。
    </p>
  </div>
</header>

<main>
  <div class="section-heading">
    <h2>動画検索</h2>
    <span class="section-label">SEARCH &amp; FILTER</span>
  </div>

  <section class="filter-panel" aria-label="検索と絞り込み">
    <h3 class="filter-title">
      <span class="filter-icon" aria-hidden="true">⌕</span>
      検索条件
    </h3>

    <div class="controls">
      <div class="control-group full-width">
        <label class="control-label" for="keyword">キーワード検索</label>
        <input
          type="text"
          id="keyword"
          placeholder="動画名・カテゴリー・クラス・タグを検索"
        >
      </div>

      <div class="control-group">
        <label class="control-label" for="categoryFilter">カテゴリー</label>
        <select id="categoryFilter">
          <option value="">すべてのカテゴリー</option>
        </select>
      </div>

      <div class="control-group">
        <label class="control-label" for="classFilter">クラス</label>
        <select id="classFilter">
          <option value="">すべてのクラス</option>
        </select>
      </div>

      <div class="control-group">
        <label class="control-label" for="tagFilter">タグ</label>
        <select id="tagFilter">
          <option value="">すべてのタグ</option>
        </select>
      </div>
    </div>
  </section>

  <div class="button-area">
    <button type="button" class="primary-button" id="searchButton">
      検索
    </button>
    <button type="button" class="secondary-button" id="resetButton">
      検索条件をリセット
    </button>
  </div>

  <div id="status" class="status" role="status" aria-live="polite">
    CSVを読み込んでいます...
  </div>

  <div class="result-info">
    <div id="resultCount" class="result-count">検索結果：0件</div>
  </div>

  <div id="videoGrid" class="video-grid"></div>

  <div id="pagination" class="pagination"></div>
  <div id="paginationInfo" class="pagination-info"></div>
</main>

<footer>
  GitHub Pages
</footer>

<script>
"use strict";

const CSV_URL = "./videos.csv";
const ITEMS_PER_PAGE = 50;

let allVideos = [];
let filteredVideos = [];
let currentPage = 1;

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}

function normalize(value) {
  return String(value ?? "").trim();
}

function splitValues(value) {
  return normalize(value)
    .split(/[|｜,，、]/)
    .map(v => v.trim())
    .filter(Boolean);
}

function includesIgnoreCase(value, keyword) {
  return normalize(value)
    .toLocaleLowerCase()
    .includes(normalize(keyword).toLocaleLowerCase());
}

function uniqueSorted(values) {
  return [...new Set(values.filter(Boolean))]
    .sort((a, b) => a.localeCompare(b, "ja"));
}

function updateSelect(selectElement, values, defaultLabel) {
  const previousValue = selectElement.value;

  selectElement.replaceChildren();

  const defaultOption = document.createElement("option");
  defaultOption.value = "";
  defaultOption.textContent = defaultLabel;
  selectElement.appendChild(defaultOption);

  for (const value of values) {
    const option = document.createElement("option");
    option.value = value;
    option.textContent = value;
    selectElement.appendChild(option);
  }

  selectElement.value = values.includes(previousValue)
    ? previousValue
    : "";
}

/* CSVを読み込む */
async function loadCSV() {
  const status = document.getElementById("status");

  try {
    const response = await fetch(CSV_URL, { cache: "no-store" });

    if (!response.ok) {
      throw new Error(
        `videos.csvを読み込めませんでした（HTTP ${response.status}）。`
      );
    }

    const csvText = await response.text();

    const parsed = Papa.parse(csvText, {
      header: true,
      skipEmptyLines: "greedy",
      transformHeader: header =>
        header.replace(/^\uFEFF/, "").trim()
    });

    if (parsed.errors.length > 0) {
      console.warn("CSV読み込み時の警告:", parsed.errors);
    }

    const requiredColumns = [
      "title",
      "category",
      "class",
      "tags",
      "id"
    ];

    const headers = parsed.meta.fields || [];
    const missingColumns = requiredColumns.filter(
      column => !headers.includes(column)
    );

    if (missingColumns.length > 0) {
      throw new Error(
        "CSVに必要な列がありません：" + missingColumns.join(", ")
      );
    }

    allVideos = parsed.data
      .map(row => ({
        title: normalize(row.title),
        category: normalize(row.category),
        className: normalize(row.class),
        tags: normalize(row.tags),
        id: normalize(row.id)
      }))
      .filter(video => video.title && video.id);

    status.className = "status success";
    status.textContent =
      `読み込み完了：${allVideos.length.toLocaleString()}件の動画を取得しました。`;

    updateCategoryOptions();
    updateClassOptions();
    updateTagOptions();
    applyFilters();

  } catch (error) {
    console.error(error);
    status.className = "status error";
    status.textContent =
      "データの読み込みに失敗しました：" + error.message +
      " videos.csvの配置場所と列名を確認してください。";
  }
}

/* カテゴリーの選択肢 */
function updateCategoryOptions() {
  const categories = uniqueSorted(
    allVideos.flatMap(video => splitValues(video.category))
  );

  updateSelect(
    document.getElementById("categoryFilter"),
    categories,
    "すべてのカテゴリー"
  );
}

/* 選択カテゴリーに対応するクラスを表示 */
function updateClassOptions() {
  const category = document.getElementById("categoryFilter").value;

  const source = category
    ? allVideos.filter(video =>
        splitValues(video.category).includes(category)
      )
    : allVideos;

  const classes = uniqueSorted(
    source.flatMap(video => splitValues(video.className))
  );

  updateSelect(
    document.getElementById("classFilter"),
    classes,
    "すべてのクラス"
  );
}

/* 選択カテゴリー・クラスに対応するタグを表示 */
function updateTagOptions() {
  const category = document.getElementById("categoryFilter").value;
  const className = document.getElementById("classFilter").value;

  let source = allVideos;

  if (category) {
    source = source.filter(video =>
      splitValues(video.category).includes(category)
    );
  }

  if (className) {
    source = source.filter(video =>
      splitValues(video.className).includes(className)
    );
  }

  const tags = uniqueSorted(
    source.flatMap(video => splitValues(video.tags))
  );

  updateSelect(
    document.getElementById("tagFilter"),
    tags,
    "すべてのタグ"
  );
}

/* 検索条件を適用 */
function applyFilters() {
  const keyword = document.getElementById("keyword").value.trim();
  const category = document.getElementById("categoryFilter").value;
  const className = document.getElementById("classFilter").value;
  const tag = document.getElementById("tagFilter").value;

  filteredVideos = allVideos.filter(video => {
    /* IDはキーワード検索の対象に含めない */
    const matchesKeyword = !keyword || [
      video.title,
      video.category,
      video.className,
      video.tags
    ].some(value => includesIgnoreCase(value, keyword));

    const matchesCategory = !category ||
      splitValues(video.category).includes(category);

    const matchesClass = !className ||
      splitValues(video.className).includes(className);

    const matchesTag = !tag ||
      splitValues(video.tags).includes(tag);

    return matchesKeyword &&
      matchesCategory &&
      matchesClass &&
      matchesTag;
  });

  currentPage = 1;
  renderVideos();
}

/* 絞り込み用チップ */
function createChips(value, type) {
  const values = splitValues(value);

  if (values.length === 0) {
    return "<span>なし</span>";
  }

  return values.map(item => `
    <button
      type="button"
      class="chip ${type === "tag" ? "tag-chip" : ""}"
      data-filter-type="${type}"
      data-filter-value="${escapeHTML(item)}"
      title="${escapeHTML(item)}で絞り込む"
    >${escapeHTML(item)}</button>
  `).join("");
}

function getYouTubeURL(id) {
  return "https://www.youtube.com/watch?v=" + encodeURIComponent(id);
}

function getThumbnailURL(id) {
  return "https://i.ytimg.com/vi/" +
    encodeURIComponent(id) + "/hqdefault.jpg";
}

/* 動画カードを生成 */
function createVideoCard(video, index) {
  const videoURL = getYouTubeURL(video.id);
  const thumbnailURL = getThumbnailURL(video.id);
  const playerId = `player-${currentPage}-${index}`;

  return `
    <article class="video-card">
      <a
        class="thumbnail-link"
        href="${escapeHTML(videoURL)}"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="${escapeHTML(video.title)}をYouTubeで開く"
      >
        <img
          class="video-thumbnail"
          src="${escapeHTML(thumbnailURL)}"
          alt="${escapeHTML(video.title)}"
          loading="lazy"
          onerror="this.outerHTML='<div class=&quot;thumbnail-placeholder&quot;>サムネイルなし</div>';"
        >
      </a>

      <div class="video-content">
        <a
          class="video-title"
          href="${escapeHTML(videoURL)}"
          target="_blank"
          rel="noopener noreferrer"
        >${escapeHTML(video.title)}</a>

        <div class="metadata">
          <div class="metadata-row">
            <span class="metadata-label">カテゴリー：</span>
            <div class="chips">
              ${createChips(video.category, "category")}
            </div>
          </div>

          <div class="metadata-row">
            <span class="metadata-label">クラス：</span>
            <div class="chips">
              ${createChips(video.className, "class")}
            </div>
          </div>

          <div class="metadata-row">
            <span class="metadata-label">タグ：</span>
            <div class="chips">
              ${createChips(video.tags, "tag")}
            </div>
          </div>
        </div>

        <button
          type="button"
          class="play-button"
          data-player-id="${playerId}"
          data-video-id="${escapeHTML(video.id)}"
        >ページ内で再生</button>

        <div class="player-container" id="${playerId}" hidden></div>
      </div>
    </article>
  `;
}

/* 動画一覧を表示 */
function renderVideos() {
  const grid = document.getElementById("videoGrid");
  const resultCount = document.getElementById("resultCount");
  const paginationInfo = document.getElementById("paginationInfo");

  const totalItems = filteredVideos.length;
  const totalPages = Math.ceil(totalItems / ITEMS_PER_PAGE);

  if (totalPages > 0 && currentPage > totalPages) {
    currentPage = totalPages;
  }

  const startIndex = (currentPage - 1) * ITEMS_PER_PAGE;
  const pageVideos = filteredVideos.slice(
    startIndex,
    startIndex + ITEMS_PER_PAGE
  );

  resultCount.textContent =
    `検索結果：${totalItems.toLocaleString()}件`;

  if (pageVideos.length === 0) {
    grid.innerHTML = `
      <div class="empty-message">
        該当する動画がありません。検索条件を変更してください。
      </div>
    `;
  } else {
    grid.innerHTML = pageVideos
      .map((video, index) => createVideoCard(video, index))
      .join("");
  }

  renderPagination(totalPages);

  paginationInfo.textContent = totalItems > 0
    ? `${startIndex + 1}～${Math.min(
        startIndex + ITEMS_PER_PAGE,
        totalItems
      )}件を表示`
    : "";
}

/* ページ切り替え */
function renderPagination(totalPages) {
  const pagination = document.getElementById("pagination");
  pagination.replaceChildren();

  if (totalPages <= 1) {
    return;
  }

  const previousButton = document.createElement("button");
  previousButton.textContent = "前へ";
  previousButton.disabled = currentPage === 1;
  previousButton.addEventListener("click", () => {
    currentPage--;
    renderVideos();
    scrollToResults();
  });
  pagination.appendChild(previousButton);

  let pages = [];

  if (totalPages <= 7) {
    pages = Array.from({ length: totalPages }, (_, i) => i + 1);
  } else {
    pages = [1];

    if (currentPage > 3) {
      pages.push("...");
    }

    for (
      let pageNumber = Math.max(2, currentPage - 1);
      pageNumber <= Math.min(totalPages - 1, currentPage + 1);
      pageNumber++
    ) {
      pages.push(pageNumber);
    }

    if (currentPage < totalPages - 2) {
      pages.push("...");
    }

    pages.push(totalPages);
  }

  pages.forEach(pageNumber => {
    if (pageNumber === "...") {
      const span = document.createElement("span");
      span.textContent = "...";
      pagination.appendChild(span);
      return;
    }

    const button = document.createElement("button");
    button.textContent = pageNumber;

    if (pageNumber === currentPage) {
      button.classList.add("active");
      button.setAttribute("aria-current", "page");
    }

    button.addEventListener("click", () => {
      currentPage = pageNumber;
      renderVideos();
      scrollToResults();
    });

    pagination.appendChild(button);
  });

  const nextButton = document.createElement("button");
  nextButton.textContent = "次へ";
  nextButton.disabled = currentPage === totalPages;
  nextButton.addEventListener("click", () => {
    currentPage++;
    renderVideos();
    scrollToResults();
  });
  pagination.appendChild(nextButton);
}

function scrollToResults() {
  document.querySelector(".result-info").scrollIntoView({
    behavior: "smooth",
    block: "start"
  });
}

/* チップ選択とページ内プレーヤー */
document.getElementById("videoGrid").addEventListener("click", event => {
  const chip = event.target.closest("[data-filter-type]");

  if (chip) {
    const type = chip.dataset.filterType;
    const value = chip.dataset.filterValue;

    if (type === "category") {
      document.getElementById("categoryFilter").value = value;

      updateClassOptions();
      document.getElementById("classFilter").value = "";

      updateTagOptions();
      document.getElementById("tagFilter").value = "";

    } else if (type === "class") {
      document.getElementById("classFilter").value = value;

      updateTagOptions();
      document.getElementById("tagFilter").value = "";

    } else if (type === "tag") {
      document.getElementById("tagFilter").value = value;
    }

    applyFilters();
    scrollToResults();
    return;
  }

  const closeButton = event.target.closest("[data-close-player]");

  if (closeButton) {
    const playerId = closeButton.dataset.closePlayer;
    const player = document.getElementById(playerId);

    player.replaceChildren();
    player.hidden = true;

    const card = player.closest(".video-card");
    const button = card.querySelector("[data-player-id]");

    if (button) {
      button.textContent = "ページ内で再生";
    }
    return;
  }

  const playButton = event.target.closest("[data-player-id]");

  if (playButton) {
    const playerId = playButton.dataset.playerId;
    const videoId = playButton.dataset.videoId;
    const player = document.getElementById(playerId);

    if (player.hidden) {
      const iframe = document.createElement("iframe");
      iframe.src =
        "https://www.youtube-nocookie.com/embed/" +
        encodeURIComponent(videoId) + "?autoplay=1";
      iframe.title = "YouTube動画プレーヤー";
      iframe.allow =
        "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
      iframe.referrerPolicy = "strict-origin-when-cross-origin";
      iframe.allowFullscreen = true;

      const closeButton = document.createElement("button");
      closeButton.type = "button";
      closeButton.className = "close-player-button";
      closeButton.dataset.closePlayer = playerId;
      closeButton.textContent = "再生を閉じる";

      player.replaceChildren(iframe, closeButton);
      player.hidden = false;
      playButton.textContent = "再生を閉じる";
    } else {
      player.replaceChildren();
      player.hidden = true;
      playButton.textContent = "ページ内で再生";
    }
  }
});

/* カテゴリー選択時 */
document.getElementById("categoryFilter").addEventListener("change", () => {
  updateClassOptions();
  document.getElementById("classFilter").value = "";

  updateTagOptions();
  document.getElementById("tagFilter").value = "";

  applyFilters();
});

/* クラス選択時 */
document.getElementById("classFilter").addEventListener("change", () => {
  updateTagOptions();
  document.getElementById("tagFilter").value = "";

  applyFilters();
});

/* タグ選択時 */
document.getElementById("tagFilter").addEventListener("change", applyFilters);

/* キーワード検索 */
document.getElementById("searchButton").addEventListener("click", applyFilters);

document.getElementById("keyword").addEventListener("keydown", event => {
  if (event.key === "Enter") {
    applyFilters();
  }
});

/* 検索条件をリセット */
document.getElementById("resetButton").addEventListener("click", () => {
  document.getElementById("keyword").value = "";
  document.getElementById("categoryFilter").value = "";

  updateClassOptions();
  document.getElementById("classFilter").value = "";

  updateTagOptions();
  document.getElementById("tagFilter").value = "";

  applyFilters();
});

/* 起動 */
loadCSV();
</script>
