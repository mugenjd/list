
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>一覧ページ</title>

  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 20px;
      background: #f5f5f5;
      color: #222;
    }

    h1 {
      text-align: center;
    }

    #search {
      display: block;
      width: 90%;
      max-width: 600px;
      box-sizing: border-box;
      margin: 20px auto;
      padding: 12px;
      font-size: 16px;
    }

    #status {
      width: 90%;
      max-width: 1200px;
      margin: 12px auto;
      color: #555;
      font-size: 15px;
    }

    .table-container {
      width: 90%;
      max-width: 1200px;
      margin: 0 auto;
      overflow-x: auto;
      background: white;
      border-radius: 6px;
    }

    table {
      width: 100%;
      min-width: 650px;
      table-layout: fixed;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 10px;
      border: 1px solid #ddd;
      text-align: left;
      vertical-align: middle;
      overflow-wrap: anywhere;
      font-size: 15px;
    }

    th {
      background: #eaeaea;
    }

    th button {
      border: none;
      background: none;
      color: #222;
      font: inherit;
      font-weight: bold;
      cursor: pointer;
      padding: 0;
    }

    th button:hover {
      text-decoration: underline;
    }

    /* 画像欄 */
    th:nth-child(1),
    td:nth-child(1) {
      width: 130px;
    }

    /* 名前欄：広め */
    th:nth-child(2),
    td:nth-child(2) {
      width: 35%;
      min-width: 200px;
      overflow-wrap: anywhere;
    }

    /* 備考欄：狭め */
    th:nth-child(3),
    td:nth-child(3) {
      width: 20%;
      max-width: 220px;
    }

    /* 更新日時欄：狭め */
    th:nth-child(4),
    td:nth-child(4) {
      width: 130px;
    }

    .item-image {
      width: 110px;
      height: 110px;
      object-fit: contain;
      background: #f0f0f0;
      border-radius: 4px;
    }

    .image-cell {
      text-align: center;
    }

    .name-link {
      font-weight: bold;
    }

    .notes {
      white-space: pre-wrap;
    }

    .date-cell {
      overflow-wrap: anywhere;
    }

    @media (max-width: 600px) {
      body {
        padding: 10px;
      }

      .table-container,
      #status {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <h1>一覧ページ</h1>

  <input
    id="search"
    type="search"
    placeholder="名前で検索..."
    aria-label="名前で検索"
  >

  <p id="status">データを読み込み中...</p>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>画像</th>
          <th>
            <button id="sort-name" type="button">
              名前 ↕
            </button>
          </th>
          <th>備考</th>
          <th>
            <button id="sort-date" type="button">
              更新日時 ↕
            </button>
          </th>
        </tr>
      </thead>
      <tbody id="items"></tbody>
    </table>
  </div>

  <script>
    let allItems = [];

    // 初期表示：更新日時の降順
    let sortKey = "更新日時";
    let sortDirection = -1;

    // CSVを読み込む
    async function loadCSV() {
      const response = await fetch("oromizudaisuki-data.csv");

      if (!response.ok) {
        throw new Error(
          "csv を読み込めません。ファイル名と配置を確認してください。"
        );
      }

      const csv = (await response.text()).replace(/^\uFEFF/, "");
      return parseCSV(csv);
    }

    // CSV解析：カンマ、引用符、セル内改行に対応
    function parseCSV(text) {
      const rows = [];
      let row = [];
      let cell = "";
      let quoted = false;

      for (let i = 0; i < text.length; i++) {
        const ch = text[i];

        if (quoted) {
          if (ch === '"') {
            if (text[i + 1] === '"') {
              cell += '"';
              i++;
            } else {
              quoted = false;
            }
          } else {
            cell += ch;
          }
        } else if (ch === '"' && cell === "") {
          quoted = true;
        } else if (ch === ",") {
          row.push(cell);
          cell = "";
        } else if (ch === "\n" || ch === "\r") {
          if (ch === "\r" && text[i + 1] === "\n") {
            i++;
          }

          row.push(cell);

          if (row.some(value => value.trim() !== "")) {
            rows.push(row);
          }

          row = [];
          cell = "";
        } else {
          cell += ch;
        }
      }

      row.push(cell);

      if (row.some(value => value.trim() !== "")) {
        rows.push(row);
      }

      if (rows.length === 0) {
        return [];
      }

      const headers = rows.shift().map(value => value.trim());

      return rows.map(values => {
        const item = {};

        headers.forEach((header, i) => {
          item[header] = (values[i] || "").trim();
        });

        return item;
      });
    }

    // HTTP / HTTPS のURLだけを許可
    function safeURL(value) {
      try {
        const url = new URL(value);

        if (
          url.protocol === "http:" ||
          url.protocol === "https:"
        ) {
          return url.href;
        }

        return "";
      } catch {
        return "";
      }
    }

    // 画像ファイルのパスを作成
    function imagePath(filename) {
      return "images/" + encodeURIComponent(filename);
    }

    // 日付を比較用の数値に変換
    function parseDate(value) {
      if (!value) {
        return null;
      }

      const match = value.match(
        /^(\d{4})[\/.-](\d{1,2})[\/.-](\d{1,2})$/
      );

      if (match) {
        const year = Number(match[1]);
        const month = Number(match[2]);
        const day = Number(match[3]);

        const date = new Date(year, month - 1, day);

        if (
          date.getFullYear() === year &&
          date.getMonth() === month - 1 &&
          date.getDate() === day
        ) {
          return date.getTime();
        }

        return null;
      }

      const timestamp = Date.parse(value);
      return Number.isNaN(timestamp) ? null : timestamp;
    }

    // 並べ替え
    function sortItems(items) {
      return [...items].sort((a, b) => {
        let result = 0;

        if (sortKey === "名前") {
          result = (a["名前"] || "").localeCompare(
            b["名前"] || "",
            "ja",
            { numeric: true, sensitivity: "base" }
          );
        } else {
          const dateA = parseDate(a["更新日時"]);
          const dateB = parseDate(b["更新日時"]);

          // 日付がないデータは常に最後
          if (dateA === null && dateB === null) {
            return 0;
          }

          if (dateA === null) {
            return 1;
          }

          if (dateB === null) {
            return -1;
          }

          result = dateA - dateB;
        }

        return result * sortDirection;
      });
    }

    // 一覧を表示
    function renderItems() {
      const container = document.getElementById("items");
      const keyword = document.getElementById("search").value
        .trim()
        .toLocaleLowerCase();

      container.replaceChildren();

      // 名前だけで検索
      const filtered = allItems.filter(item =>
        (item["名前"] || "")
          .toLocaleLowerCase()
          .includes(keyword)
      );

      const sorted = sortItems(filtered);

      document.getElementById("status").textContent =
        `${sorted.length} 件表示`;

      sorted.forEach(item => {
        const tr = document.createElement("tr");
        const linkURL = safeURL(item["公開リンク"] || "");

        // 画像
        const imageCell = document.createElement("td");
        imageCell.className = "image-cell";

        const filename = (item["画像"] || "").split(/[\\/]/).pop();

        if (filename) {
          const img = document.createElement("img");

          img.className = "item-image";
          img.src = imagePath(filename);
          img.alt = item["名前"] || "";
          img.loading = "lazy";

          img.onerror = () => {
            const parent = img.parentElement;

            if (parent && parent.tagName === "A") {
              parent.remove();
            } else {
              img.remove();
            }
          };

          if (linkURL) {
            const imageLink = document.createElement("a");

            imageLink.href = linkURL;
            imageLink.target = "_blank";
            imageLink.rel = "noopener noreferrer";
            imageLink.setAttribute(
              "aria-label",
              (item["名前"] || "画像") + " のリンクを開く"
            );

            imageLink.appendChild(img);
            imageCell.appendChild(imageLink);
          } else {
            imageCell.appendChild(img);
          }
        }

        tr.appendChild(imageCell);

        // 名前：クリックすると公開リンクを開く
        const nameCell = document.createElement("td");
        const name = item["名前"] || "名前なし";

        if (linkURL) {
          const nameLink = document.createElement("a");

          nameLink.className = "name-link";
          nameLink.href = linkURL;
          nameLink.textContent = name;
          nameLink.target = "_blank";
          nameLink.rel = "noopener noreferrer";

          nameCell.appendChild(nameLink);
        } else {
          nameCell.textContent = name;
        }

        tr.appendChild(nameCell);

        // 備考
        const notesCell = document.createElement("td");
        notesCell.className = "notes";
        notesCell.textContent = item["備考"] || "";
        tr.appendChild(notesCell);

        // 更新日時
        const dateCell = document.createElement("td");
        dateCell.className = "date-cell";
        dateCell.textContent = item["更新日時"] || "";
        tr.appendChild(dateCell);

        container.appendChild(tr);
      });

      // 並べ替えボタンの表示
      document.getElementById("sort-name").textContent =
        "名前 " +
        (sortKey === "名前"
          ? (sortDirection === 1 ? "↑" : "↓")
          : "↕");

      document.getElementById("sort-date").textContent =
        "更新日時 " +
        (sortKey === "更新日時"
          ? (sortDirection === 1 ? "↑" : "↓")
          : "↕");
    }

    // 名前の並べ替え
    document.getElementById("sort-name").addEventListener(
      "click",
      () => {
        if (sortKey === "名前") {
          sortDirection *= -1;
        } else {
          sortKey = "名前";
          sortDirection = 1;
        }

        renderItems();
      }
    );

    // 更新日時の並べ替え
    document.getElementById("sort-date").addEventListener(
      "click",
      () => {
        if (sortKey === "更新日時") {
          sortDirection *= -1;
        } else {
          sortKey = "更新日時";
          sortDirection = 1;
        }

        renderItems();
      }
    );

    // 初期化
    async function init() {
      try {
        allItems = await loadCSV();

        document.getElementById("search").addEventListener(
          "input",
          renderItems
        );

        renderItems();
      } catch (error) {
        document.getElementById("status").textContent =
          "読み込みエラー：" + error.message;
      }
    }

    init();
  </script>
</body>
</html>
