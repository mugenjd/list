
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#6d28d9">
  <title>オロミズ大好き氏一覧</title>

  <style>
    :root {
      --primary: #7c3aed;
      --primary-dark: #6d28d9;
      --primary-deep: #4c1d95;
      --primary-light: #f5f3ff;
      --primary-border: #ddd6fe;
      --text: #1f2937;
      --muted: #64748b;
      --border: #e5e7eb;
      --background: #faf8ff;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      color: var(--text);
      background: var(--background);
      font-family:
        -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Noto Sans JP", Meiryo, sans-serif;
      line-height: 1.65;
    }

    /* ヘッダー */
    .hero {
      position: relative;
      overflow: hidden;
      padding: 36px 24px 42px;
      color: white;
      background: linear-gradient(
        120deg,
        #4c1d95 0%,
        #6d28d9 50%,
        #a78bfa 100%
      );
    }

    .hero::before,
    .hero::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      pointer-events: none;
    }

    .hero::before {
      width: 300px;
      height: 300px;
      top: -170px;
      right: 6%;
    }

    .hero::after {
      width: 220px;
      height: 220px;
      bottom: -155px;
      right: 24%;
    }

    .hero-inner {
      position: relative;
      z-index: 1;
      max-width: 1200px;
      margin: 0 auto;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 20px;
      padding: 7px 13px;
      color: white;
      text-decoration: none;
      font-size: 14px;
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 9px;
      background: rgba(255, 255, 255, 0.1);
      transition: background 0.2s;
    }

    .back-link:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(26px, 4vw, 38px);
      line-height: 1.35;
      font-weight: 800;
      text-align: left;
    }

    .hero-description {
      margin: 0;
      color: rgba(255, 255, 255, 0.88);
      font-size: 14px;
    }

    /* メイン */
    main {
      max-width: 1250px;
      margin: 0 auto;
      padding: 30px 24px 50px;
    }

    .section-heading {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 16px;
      font-size: 21px;
      font-weight: 800;
    }

    .section-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      flex-shrink: 0;
      color: var(--primary-dark);
      background: var(--primary-light);
      border: 1px solid var(--primary-border);
      border-radius: 10px;
      font-size: 19px;
    }

    /* 検索 */
    .search-panel {
      margin-bottom: 20px;
      padding: 20px;
      background: var(--white);
      border: 1px solid var(--primary-border);
      border-radius: 14px;
      box-shadow: 0 5px 18px rgba(76, 29, 149, 0.045);
    }

    #search {
      display: block;
      width: 100%;
      max-width: 650px;
      min-height: 46px;
      margin: 0 auto;
      padding: 11px 15px;
      color: var(--text);
      background: white;
      border: 1px solid #c4b5fd;
      border-radius: 10px;
      outline: none;
      font-size: 16px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    #search::placeholder {
      color: #9ca3af;
    }

    #search:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.13);
    }

    /* 件数表示 */
    #status {
      margin: 18px 0 14px;
      color: var(--muted);
      font-size: 14px;
    }

    #status.error {
      color: #b91c1c;
      font-weight: 700;
    }

    .count-label {
      display: inline-block;
      margin-right: 7px;
      padding: 3px 10px;
      color: var(--primary-dark);
      background: var(--primary-light);
      border: 1px solid var(--primary-border);
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
    }

    /* テーブル */
    .table-container {
      width: 100%;
      overflow-x: auto;
      background: white;
      border: 1px solid var(--primary-border);
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(76, 29, 149, 0.04);
    }

    table {
      width: 100%;
      min-width: 650px;
      table-layout: fixed;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 12px 10px;
      border: 1px solid var(--border);
      text-align: left;
      vertical-align: middle;
      overflow-wrap: anywhere;
      font-size: 14px;
    }

    th {
      color: white;
      background: #6d28d9;
      font-weight: 700;
    }

    th:first-child {
      border-left-color: #6d28d9;
    }

    th button {
      padding: 0;
      color: white;
      background: none;
      border: none;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      text-align: left;
    }

    th button:hover {
      color: #ede9fe;
      text-decoration: underline;
    }

    th button:focus-visible {
      outline: 2px solid white;
      outline-offset: 4px;
      border-radius: 2px;
    }

    tbody tr {
      transition: background 0.15s;
    }

    tbody tr:nth-child(even) {
      background: #fcfbff;
    }

    tbody tr:hover {
      background: #f5f3ff;
    }

    /* 画像欄 */
    th:nth-child(1),
    td:nth-child(1) {
      width: 130px;
    }

    /* 名前欄：広め */
    th:nth-child(2),
    td:nth-child(2) {
      width: 35%;
      min-width: 200px;
      overflow-wrap: anywhere;
    }

    /* 備考欄：狭め */
    th:nth-child(3),
    td:nth-child(3) {
      width: 20%;
      max-width: 220px;
    }

    /* 更新日時欄 */
    th:nth-child(4),
    td:nth-child(4) {
      width: 130px;
    }

    .image-cell {
      text-align: center;
    }

    .item-image {
      display: block;
      width: 110px;
      height: 110px;
      margin: 0 auto;
      object-fit: contain;
      background: #f5f3ff;
      border: 1px solid #ede9fe;
      border-radius: 7px;
      transition: transform 0.2s;
    }

    a:hover .item-image {
      transform: scale(1.035);
    }

    .name-link {
      color: var(--primary-dark);
      font-weight: 700;
      text-decoration: none;
    }

    .name-link:hover {
      color: var(--primary-deep);
      text-decoration: underline;
    }

    .notes {
      color: #4b5563;
      white-space: pre-wrap;
    }

    .date-cell {
      color: #575569;
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    /* データなし */
    .empty-row {
      padding: 35px 15px;
      color: var(--muted);
      text-align: center;
    }

    /* フッター */
    footer {
      padding: 22px 20px;
      color: var(--muted);
      background: white;
      border-top: 1px solid var(--primary-border);
      text-align: center;
      font-size: 12px;
    }

    footer a {
      color: var(--primary-dark);
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }

    @media (max-width: 700px) {
      .hero {
        padding: 28px 17px 32px;
      }

      main {
        padding: 22px 12px 35px;
      }

      .search-panel {
        padding: 15px;
      }

      th,
      td {
        padding: 9px 8px;
        font-size: 13px;
      }

      .item-image {
        width: 95px;
        height: 95px;
      }

      th:nth-child(1),
      td:nth-child(1) {
        width: 110px;
      }

      th:nth-child(2),
      td:nth-child(2) {
        min-width: 170px;
      }

      th:nth-child(4),
      td:nth-child(4) {
        width: 115px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <header class="hero">
    <div class="hero-inner">
      <a class="back-link" href="./index.html">
        ← トップページへ戻る
      </a>

      <h1>オロミズ大好き氏一覧</h1>
      <p class="hero-description">
        名前で検索し、画像・公開リンク・備考・更新日時を確認できます。
      </p>
    </div>
  </header>

  <main>
    <h2 class="section-heading">
      <span class="section-icon" aria-hidden="true">⌕</span>
      名前で検索
    </h2>

    <section class="search-panel" aria-label="一覧の検索">
      <input
        id="search"
        type="search"
        placeholder="名前で検索..."
        aria-label="名前で検索"
        autocomplete="off"
      >
    </section>

    <p id="status" role="status" aria-live="polite">
      データを読み込み中...
    </p>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th scope="col">画像</th>
            <th scope="col">
              <button id="sort-name" type="button">
                名前 ↕
              </button>
            </th>
            <th scope="col">備考</th>
            <th scope="col">
              <button id="sort-date" type="button">
                更新日時 ↓
              </button>
            </th>
          </tr>
        </thead>

        <tbody id="items">
          <tr>
            <td colspan="4" class="empty-row">
              データを読み込んでいます…
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>

  <footer>
    <a href="./index.html">トップページへ戻る</a>
  </footer>

  <script>
    "use strict";

    let allItems = [];

    // 初期表示：更新日時の降順
    let sortKey = "更新日時";
    let sortDirection = -1;

    // CSVを読み込む
    async function loadCSV() {
      const response = await fetch("./oromizudaisuki-data.csv", {
        cache: "no-store"
      });

      if (!response.ok) {
        throw new Error(
          "CSVを読み込めません。ファイル名と配置を確認してください。"
        );
      }

      const csv = (await response.text()).replace(/^\uFEFF/, "");
      return parseCSV(csv);
    }

    // CSV解析：カンマ、引用符、セル内改行に対応
    function parseCSV(text) {
      const rows = [];
      let row = [];
      let cell = "";
      let quoted = false;

      for (let i = 0; i < text.length; i++) {
        const ch = text[i];

        if (quoted) {
          if (ch === '"') {
            if (text[i + 1] === '"') {
              cell += '"';
              i++;
            } else {
              quoted = false;
            }
          } else {
            cell += ch;
          }
        } else if (ch === '"' && cell === "") {
          quoted = true;
        } else if (ch === ",") {
          row.push(cell);
          cell = "";
        } else if (ch === "\n" || ch === "\r") {
          if (ch === "\r" && text[i + 1] === "\n") {
            i++;
          }

          row.push(cell);

          if (row.some(value => value.trim() !== "")) {
            rows.push(row);
          }

          row = [];
          cell = "";
        } else {
          cell += ch;
        }
      }

      // 最終行を処理
      row.push(cell);

      if (row.some(value => value.trim() !== "")) {
        rows.push(row);
      }

      if (rows.length === 0) {
        return [];
      }

      const headers = rows.shift().map(value => value.trim());

      return rows.map(values => {
        const item = {};

        headers.forEach((header, i) => {
          item[header] = (values[i] ?? "").trim();
        });

        return item;
      });
    }

    // HTTP / HTTPS のURLだけを許可
    function safeURL(value) {
      try {
        const url = new URL(value);

        if (url.protocol === "http:" || url.protocol === "https:") {
          return url.href;
        }

        return "";
      } catch {
        return "";
      }
    }

    // 画像ファイルのパスを作成
    function imagePath(filename) {
      return "./images/" +
        filename.split("/").map(part => encodeURIComponent(part)).join("/");
    }

    // 日付を比較用の数値に変換
    function parseDate(value) {
      if (!value) {
        return null;
      }

      // YYYY/M/D、YYYY-MM-DD、YYYY.M.D に対応
      const match = value.match(
        /^(\d{4})[\/.-](\d{1,2})[\/.-](\d{1,2})$/
      );

      if (match) {
        const year = Number(match[1]);
        const month = Number(match[2]);
        const day = Number(match[3]);

        const date = new Date(year, month - 1, day);

        if (
          date.getFullYear() === year &&
          date.getMonth() === month - 1 &&
          date.getDate() === day
        ) {
          return date.getTime();
        }

        return null;
      }

      // 時刻付きの日付などにも対応
      const timestamp = Date.parse(value);

      return Number.isNaN(timestamp) ? null : timestamp;
    }

    // 並べ替え
    function sortItems(items) {
      return [...items].sort((a, b) => {
        let result = 0;

        if (sortKey === "名前") {
          result = (a["名前"] || "").localeCompare(
            b["名前"] || "",
            "ja",
            { numeric: true, sensitivity: "base" }
          );
        } else {
          const dateA = parseDate(a["更新日時"]);
          const dateB = parseDate(b["更新日時"]);

          // 日付がないデータは、昇順・降順にかかわらず最後
          if (dateA === null && dateB === null) {
            return 0;
          }

          if (dateA === null) {
            return 1;
          }

          if (dateB === null) {
            return -1;
          }

          result = dateA - dateB;
        }

        return result * sortDirection;
      });
    }

    // 一覧を表示
    function renderItems() {
      const container = document.getElementById("items");
      const keyword = document.getElementById("search").value
        .trim()
        .toLocaleLowerCase("ja");

      container.replaceChildren();

      // 名前だけで検索
      const filtered = allItems.filter(item =>
        (item["名前"] || "")
          .toLocaleLowerCase("ja")
          .includes(keyword)
      );

      const sorted = sortItems(filtered);

      const status = document.getElementById("status");
      status.classList.remove("error");

      const countLabel = document.createElement("span");
      countLabel.className = "count-label";
      countLabel.textContent = sorted.length.toLocaleString("ja-JP") + " 件";

      status.replaceChildren(countLabel, document.createTextNode("表示中"));

      if (sorted.length === 0) {
        const tr = document.createElement("tr");
        const td = document.createElement("td");

        td.colSpan = 4;
        td.className = "empty-row";
        td.textContent = allItems.length === 0
          ? "表示できるデータがありません。"
          : "該当する名前が見つかりませんでした。";

        tr.appendChild(td);
        container.appendChild(tr);
      }

      sorted.forEach(item => {
        const tr = document.createElement("tr");
        const linkURL = safeURL(item["公開リンク"] || "");

        // 画像
        const imageCell = document.createElement("td");
        imageCell.className = "image-cell";

        const filename = (item["画像"] || "")
          .split(/[\\/]/)
          .pop();

        if (filename) {
          const img = document.createElement("img");

          img.className = "item-image";
          img.src = imagePath(filename);
          img.alt = item["名前"] || "";
          img.loading = "lazy";
          img.decoding = "async";

          img.onerror = () => {
            const parent = img.parentElement;

            if (parent && parent.tagName === "A") {
              parent.remove();
            } else {
              img.remove();
            }
          };

          if (linkURL) {
            const imageLink = document.createElement("a");

            imageLink.href = linkURL;
            imageLink.target = "_blank";
            imageLink.rel = "noopener noreferrer";
            imageLink.setAttribute(
              "aria-label",
              (item["名前"] || "画像") + " のリンクを開く"
            );

            imageLink.appendChild(img);
            imageCell.appendChild(imageLink);
          } else {
            imageCell.appendChild(img);
          }
        }

        tr.appendChild(imageCell);

        // 名前：クリックすると公開リンクを開く
        const nameCell = document.createElement("td");
        const name = item["名前"] || "名前なし";

        if (linkURL) {
          const nameLink = document.createElement("a");

          nameLink.className = "name-link";
          nameLink.href = linkURL;
          nameLink.textContent = name;
          nameLink.target = "_blank";
          nameLink.rel = "noopener noreferrer";

          nameCell.appendChild(nameLink);
        } else {
          nameCell.textContent = name;
        }

        tr.appendChild(nameCell);

        // 備考
        const notesCell = document.createElement("td");
        notesCell.className = "notes";
        notesCell.textContent = item["備考"] || "";
        tr.appendChild(notesCell);

        // 更新日時
        const dateCell = document.createElement("td");
        dateCell.className = "date-cell";
        dateCell.textContent = item["更新日時"] || "";
        tr.appendChild(dateCell);

        container.appendChild(tr);
      });

      // 並べ替えボタンの表示
      document.getElementById("sort-name").textContent =
        "名前 " +
        (sortKey === "名前"
          ? (sortDirection === 1 ? "↑" : "↓")
          : "↕");

      document.getElementById("sort-date").textContent =
        "更新日時 " +
        (sortKey === "更新日時"
          ? (sortDirection === 1 ? "↑" : "↓")
          : "↕");
    }

    // 名前の並べ替え
    document.getElementById("sort-name").addEventListener(
      "click",
      () => {
        if (sortKey === "名前") {
          sortDirection *= -1;
        } else {
          sortKey = "名前";
          sortDirection = 1;
        }

        renderItems();
      }
    );

    // 更新日時の並べ替え
    document.getElementById("sort-date").addEventListener(
      "click",
      () => {
        if (sortKey === "更新日時") {
          sortDirection *= -1;
        } else {
          sortKey = "更新日時";
          sortDirection = -1;
        }

        renderItems();
      }
    );

    // 初期化
    async function init() {
      try {
        allItems = await loadCSV();

        document.getElementById("search").addEventListener(
          "input",
          renderItems
        );

        renderItems();
      } catch (error) {
        console.error(error);

        const status = document.getElementById("status");
        status.classList.add("error");
        status.textContent = "読み込みエラー：" + error.message;

        const container = document.getElementById("items");
        container.replaceChildren();

        const tr = document.createElement("tr");
        const td = document.createElement("td");

        td.colSpan = 4;
        td.className = "empty-row";
        td.textContent =
          "CSVを読み込めませんでした。ファイル名・配置・CSVの列名を確認してください。";

        tr.appendChild(td);
        container.appendChild(tr);
      }
    }

    init();
  </script>
</body>
</html>
