<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>オロミズ大好き氏キャラクター一覧</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- PapaParse CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
    .mono { font-family: 'JetBrains Mono', monospace; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #020617; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #334155; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen py-8 px-4 sm:px-6 lg:px-8 selection:bg-cyan-500 selection:text-slate-950">
  <div class="max-w-6xl mx-auto space-y-6">

    <!-- ヘッダーエリア -->
    <header class="border-b border-slate-800/80 pb-6 flex flex-col md:flex-row md:items-end justify-between gap-4">
      <div>
        <div class="inline-flex items-center gap-2 px-2.5 py-0.5 rounded-full bg-cyan-950/80 border border-cyan-800/60 text-cyan-400 text-xs font-semibold tracking-wider uppercase mb-2">
          <span class="w-1.5 h-1.5 rounded-full bg-cyan-400 animate-pulse"></span>
          Archive Hub
        </div>
        <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight text-white flex items-center gap-2">
          オロミズ大好き氏キャラクター一覧
        </h1>
      </div>

      <!-- ステータス ＆ カウンターバッジ -->
      <div class="flex items-center gap-3 self-start md:self-auto flex-wrap">
        <div id="statusBadge" class="text-xs bg-slate-900 border border-slate-800 px-3 py-1.5 rounded-xl text-slate-400 flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-amber-400 animate-ping"></span>
          <span id="statusText">CSV読込中...</span>
        </div>

        <div class="text-xs bg-slate-900 border border-slate-800 px-3 py-1.5 rounded-xl text-slate-400 flex items-center gap-1.5 mono">
          <span>表示:</span>
          <span id="filteredCount" class="font-bold text-cyan-400 text-sm">0</span>
          <span class="text-slate-600">/</span>
          <span id="totalCount" class="font-semibold text-slate-300">0</span>
        </div>
      </div>
    </header>

    <!-- CORS / ローカル実行時の手動フォールバック -->
    <div id="fileUploadPrompt" class="hidden bg-slate-900/90 border border-amber-500/40 rounded-2xl p-4 text-xs sm:text-sm text-slate-300 shadow-lg">
      <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3">
        <div class="flex items-center gap-2 text-amber-400 font-semibold">
          <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
          </svg>
          <span>oromizudaisuki.csv の自動取得に失敗しました（ローカル実行時は手動選択してください）</span>
        </div>
        <label class="cursor-pointer bg-amber-500/20 hover:bg-amber-500/30 text-amber-300 border border-amber-500/50 px-3 py-1.5 rounded-xl font-medium transition text-xs whitespace-nowrap">
          CSVファイルを手動選択
          <input type="file" id="manualFileInput" accept=".csv" class="hidden">
        </label>
      </div>
    </div>

    <!-- コントロールバー -->
    <div class="bg-slate-900/90 rounded-2xl p-3.5 sm:p-4 border border-slate-800 shadow-xl flex flex-col md:flex-row gap-3 backdrop-blur-sm">
      <div class="relative flex-1">
        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
          <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
          </svg>
        </div>
        <input 
          type="text" 
          id="searchInput" 
          placeholder="ファイル名・フォルダ名でリアルタイム検索..." 
          class="w-full bg-slate-950 border border-slate-800 rounded-xl pl-10 pr-4 py-2.5 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:border-cyan-500 transition-all"
        />
      </div>

      <div class="w-full md:w-72">
        <select 
          id="folderFilter" 
          class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm text-slate-100 focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:border-cyan-500 transition-all cursor-pointer"
        >
          <option value="">すべてのフォルダ (全件)</option>
        </select>
      </div>
    </div>

    <!-- テーブル -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-2xl">
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm text-slate-300">
          <thead class="bg-slate-950 text-xs uppercase tracking-wider text-slate-400 border-b border-slate-800">
            <tr>
              <th scope="col" class="py-3.5 px-4 sm:px-6 font-semibold w-1/3">フォルダ名</th>
              <th scope="col" class="py-3.5 px-4 sm:px-6 font-semibold">ファイル名</th>
              <th scope="col" class="py-3.5 px-4 sm:px-6 font-semibold text-center w-36">リンク</th>
            </tr>
          </thead>
          <tbody id="tableBody" class="divide-y divide-slate-800/70">
            <tr class="animate-pulse">
              <td class="py-4 px-4 sm:px-6"><div class="h-4 bg-slate-800 rounded w-3/4"></div></td>
              <td class="py-4 px-4 sm:px-6"><div class="h-4 bg-slate-800 rounded w-1/2"></div></td>
              <td class="py-4 px-4 sm:px-6 text-center"><div class="h-8 bg-slate-800 rounded-lg w-20 mx-auto"></div></td>
            </tr>
          </tbody>
        </table>
      </div>

      <div id="noResults" class="hidden p-12 text-center text-slate-400">
        <svg class="mx-auto h-10 w-10 text-slate-600 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <p class="text-sm">条件に一致するファイルが見つかりませんでした。</p>
      </div>
    </div>

    <!-- コピートースト -->
    <div id="toast" class="fixed bottom-6 right-6 bg-cyan-600 text-slate-950 font-semibold px-4 py-2.5 rounded-xl shadow-2xl opacity-0 pointer-events-none transition-all duration-300 transform translate-y-2 flex items-center gap-2 text-sm z-50">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
      </svg>
      <span>リンクをクリップボードにコピーしました</span>
    </div>

    <footer class="flex flex-col sm:flex-row justify-between items-center text-xs text-slate-600 py-3 gap-2">
      <div>Hosted on GitHub Pages</div>
    </footer>
  </div>

  <script>
    let archiveData = [];
    const CSV_FILENAME = './oromizudaisuki.csv';

    const searchInput = document.getElementById('searchInput');
    const folderFilter = document.getElementById('folderFilter');
    const tableBody = document.getElementById('tableBody');
    const noResults = document.getElementById('noResults');
    const totalCount = document.getElementById('totalCount');
    const filteredCount = document.getElementById('filteredCount');
    const statusBadge = document.getElementById('statusBadge');
    const fileUploadPrompt = document.getElementById('fileUploadPrompt');
    const manualFileInput = document.getElementById('manualFileInput');
    const toast = document.getElementById('toast');

    function showToast(message) {
      toast.querySelector('span').innerText = message;
      toast.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-2');
      toast.classList.add('opacity-100', 'translate-y-0');
      setTimeout(() => {
        toast.classList.add('opacity-0', 'pointer-events-none', 'translate-y-2');
        toast.classList.remove('opacity-100', 'translate-y-0');
      }, 2000);
    }

    window.copyToClipboard = async function(url) {
      if (!url) return;
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(url);
        showToast('リンクをコピーしました');
      } else {
        const textarea = document.createElement('textarea');
        textarea.value = url;
        textarea.style.position = 'fixed';
        textarea.style.left = '-9999px';
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
        showToast('リンクをコピーしました');
      }
    };

    function parseCSVContent(csvString) {
      Papa.parse(csvString, {
        header: true,
        skipEmptyLines: true,
        dynamicTyping: false,
        complete: function(results) {
          archiveData = results.data
            .map(row => {
              const folder = row["フォルダ名"] || row["Folder"] || row["folder"] || "";
              const file = row["ファイル名"] || row["File"] || row["filename"] || "";
              const url = row["公開リンク"] || row["URL"] || row["url"] || row["Link"] || "";
              return { folder: folder.trim(), file: file.trim(), url: url.trim() };
            })
            .filter(item => item.file && item.url);

          onDataLoaded();
        },
        error: function(error) {
          showErrorState('CSVのパースに失敗しました');
          console.error('PapaParse error:', error);
        }
      });
    }

    function onDataLoaded() {
      statusBadge.className = 'text-xs bg-emerald-950/80 border border-emerald-800/80 px-3 py-1.5 rounded-xl text-emerald-400 flex items-center gap-2';
      statusBadge.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-400"></span><span>${archiveData.length} 件ロード完了</span>`;
      fileUploadPrompt.classList.add('hidden');

      const folders = Array.from(new Set(archiveData.map(item => item.folder).filter(Boolean))).sort();
      folderFilter.innerHTML = '<option value="">すべてのフォルダ (全件)</option>';
      folders.forEach(folder => {
        const opt = document.createElement('option');
        opt.value = folder;
        opt.textContent = folder;
        folderFilter.appendChild(opt);
      });

      totalCount.textContent = archiveData.length;
      renderTable();
    }

    function showErrorState(msg) {
      statusBadge.className = 'text-xs bg-rose-950/80 border border-rose-800/80 px-3 py-1.5 rounded-xl text-rose-400 flex items-center gap-2';
      statusBadge.innerHTML = `<span class="w-2 h-2 rounded-full bg-rose-400"></span><span>${msg}</span>`;
      fileUploadPrompt.classList.remove('hidden');
      tableBody.innerHTML = `<tr><td colspan="3" class="py-8 text-center text-slate-500 text-sm">データを読み込めませんでした。同ディレクトリに <code class="text-cyan-400 mono">${CSV_FILENAME}</code> が配置されているか確認してください。</td></tr>`;
      totalCount.textContent = '0';
      filteredCount.textContent = '0';
    }

    function renderTable() {
      const query = searchInput.value.toLowerCase().trim();
      const selectedFolder = folderFilter.value;

      const filtered = archiveData.filter(item => {
        const matchesFolder = !selectedFolder || item.folder === selectedFolder;
        const matchesQuery = !query || 
          item.file.toLowerCase().includes(query) || 
          item.folder.toLowerCase().includes(query);
        return matchesFolder && matchesQuery;
      });

      filteredCount.textContent = filtered.length;

      if (filtered.length === 0) {
        tableBody.innerHTML = '';
        noResults.classList.remove('hidden');
        return;
      }

      noResults.classList.add('hidden');

      tableBody.innerHTML = filtered.map(item => `
        <tr class="hover:bg-slate-800/40 transition-colors group">
          <td class="py-3 px-4 sm:px-6 align-middle">
            <span class="inline-flex items-center px-2.5 py-1 rounded-lg text-xs font-medium bg-slate-800/80 text-cyan-300 border border-slate-700/60 max-w-full truncate" title="${escapeHtml(item.folder)}">
              ${escapeHtml(item.folder || "ルート")}
            </span>
          </td>
          <td class="py-3 px-4 sm:px-6 align-middle">
            <div class="font-medium text-slate-100 group-hover:text-cyan-200 transition-colors break-all">
              ${escapeHtml(item.file)}
            </div>
          </td>
          <td class="py-3 px-4 sm:px-6 align-middle text-center">
            <div class="flex items-center justify-center gap-1.5">
              <a 
                href="${escapeHtml(item.url)}" 
                target="_blank" 
                rel="noopener noreferrer" 
                class="inline-flex items-center gap-1 px-3 py-1.5 bg-cyan-600 hover:bg-cyan-500 text-slate-950 font-bold text-xs rounded-lg transition-all shadow hover:shadow-cyan-500/20"
                title="ダウンロードまたは表示"
              >
                <span>開く</span>
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
                </svg>
              </a>
              <button 
                type="button" 
                onclick="copyToClipboard('${escapeJsString(item.url)}')"
                class="p-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white rounded-lg border border-slate-700 transition"
                title="リンクをコピー"
              >
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"/>
                </svg>
              </button>
            </div>
          </td>
        </tr>
      `).join('');
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function escapeJsString(str) {
      if (!str) return '';
      return str.replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '\\"');
    }

    searchInput.addEventListener('input', renderTable);
    folderFilter.addEventListener('change', renderTable);

    manualFileInput.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          parseCSVContent(evt.target.result);
        };
        reader.readAsText(file, 'UTF-8');
      }
    });

    window.addEventListener('DOMContentLoaded', () => {
      fetch(CSV_FILENAME, { cache: 'no-cache' })
        .then(response => {
          if (!response.ok) throw new Error(`HTTP error: ${response.status}`);
          return response.text();
        })
        .then(csvText => parseCSVContent(csvText))
        .catch(err => {
          console.warn('自動フェッチ失敗:', err);
          showErrorState('oromizudaisuki.csv が見つかりません');
        });
    });
  </script>
</body>
</html>
