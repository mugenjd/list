<script>
"use strict";

let allItems = [];
let dateSortOrder = "desc";

const search = document.getElementById("search");
const group = document.getElementById("group");
const page = document.getElementById("page");
const statusEl = document.getElementById("status");
const tbody = document.getElementById("rows");
const dateSort = document.getElementById("dateSort");
const dateSortIcon = document.getElementById("dateSortIcon");

const groupOrder = [
  "凶悪キャラスレアップローダ",
  "ターゲット倉庫",
  "むげん代理公開場"
];

/**
 * CSV解析
 * カンマ、ダブルクォート、セル内改行に対応
 */
function parseCSV(text) {
  // UTF-8 BOMを除去
  text = text.replace(/^\uFEFF/, "");

  const rows = [];
  let row = [];
  let field = "";
  let inQuotes = false;

  for (let i = 0; i < text.length; i++) {
    const ch = text[i];

    if (inQuotes) {
      if (ch === '"') {
        if (text[i + 1] === '"') {
          field += '"';
          i++;
        } else {
          inQuotes = false;
        }
      } else {
        field += ch;
      }
    } else {
      if (ch === '"') {
        inQuotes = true;
      } else if (ch === ",") {
        row.push(field);
        field = "";
      } else if (ch === "\n") {
        row.push(field);
        rows.push(row);
        row = [];
        field = "";
      } else if (ch !== "\r") {
        field += ch;
      }
    }
  }

  // 最終行を追加
  if (field !== "" || row.length > 0) {
    row.push(field);
    rows.push(row);
  }

  if (rows.length === 0) {
    return [];
  }

  const headers = rows.shift().map(h => h.trim());

  return rows
    .filter(r => r.some(v => v.trim() !== ""))
    .map(r => {
      const item = {};

      headers.forEach((header, index) => {
        item[header] = r[index] ?? "";
      });

      return item;
    });
}

// 日時文字列を比較用の数値に変換
// 対応例：26/10/10 12:10
function parseDate(value) {
  if (!value) return null;

  const match = String(value).trim().match(
    /^(\d{2})\/(\d{1,2})\/(\d{1,2})\s+(\d{1,2}):(\d{2})$/
  );

  if (!match) return null;

  const [, yy, mm, dd, hh, min] = match;

  const year = Number(yy) >= 70
    ? 1900 + Number(yy)
    : 2000 + Number(yy);

  const month = Number(mm);
  const day = Number(dd);
  const hour = Number(hh);
  const minute = Number(min);

  if (
    month < 1 || month > 12 ||
    day < 1 || day > 31 ||
    hour < 0 || hour > 23 ||
    minute < 0 || minute > 59
  ) {
    return null;
  }

  const date = new Date(
    year, month - 1, day, hour, minute
  );

  if (
    date.getFullYear() !== year ||
    date.getMonth() !== month - 1 ||
    date.getDate() !== day ||
    date.getHours() !== hour ||
    date.getMinutes() !== minute
  ) {
    return null;
  }

  return date.getTime();
}

// 日時見出しで昇順・降順を切り替え
function toggleDateSort() {
  dateSortOrder = dateSortOrder === "desc" ? "asc" : "desc";

  dateSortIcon.textContent =
    dateSortOrder === "desc" ? "▼" : "▲";

  dateSort.setAttribute(
    "aria-sort",
    dateSortOrder === "desc" ? "descending" : "ascending"
  );

  render();
}

dateSort.addEventListener("click", toggleDateSort);

dateSort.addEventListener("keydown", event => {
  if (event.key === "Enter" || event.key === " ") {
    event.preventDefault();
    toggleDateSort();
  }
});

// ページ名から数字を取得
function getPageNumber(name) {
  const match = String(name).match(/(\d+)\s*(?:\||$)/);
  if (match) return Number(match[1]);

  const fallback = String(name).match(/(\d+)/);
  return fallback ? Number(fallback[1]) : null;
}

// ページ名の並べ替え
function comparePages(a, b) {
  const numA = getPageNumber(a);
  const numB = getPageNumber(b);

  if (numA === null && numB !== null) return -1;
  if (numA !== null && numB === null) return 1;

  if (
    numA !== null &&
    numB !== null &&
    numA !== numB
  ) {
    return numA - numB;
  }

  return a.localeCompare(b, "ja");
}

// 一覧の選択に応じてページの選択肢を更新
function updatePages() {
  const selectedGroup = group.value;
  const previousPage = page.value;

  const pages = [...new Set(
    allItems
      .filter(x => !selectedGroup || x.group === selectedGroup)
      .map(x => x.page || "")
      .filter(Boolean)
  )].sort((a, b) => {
    if (!selectedGroup) {
      const groupA = groupOrder.findIndex(g =>
        allItems.some(x => x.group === g && x.page === a)
      );

      const groupB = groupOrder.findIndex(g =>
        allItems.some(x => x.group === g && x.page === b)
      );

      if (groupA !== groupB) {
        return (
          (groupA === -1 ? Infinity : groupA) -
          (groupB === -1 ? Infinity : groupB)
        );
      }
    }

    return comparePages(a, b);
  });

  page.replaceChildren();

  const allOption = document.createElement("option");
  allOption.value = "";
  allOption.textContent = "すべてのページ";
  page.appendChild(allOption);

  for (const pageName of pages) {
    const option = document.createElement("option");
    option.value = pageName;
    option.textContent = pageName;
    page.appendChild(option);
  }

  page.value = pages.includes(previousPage) ? previousPage : "";
}

// 結果が0件の場合の表示
function showEmptyMessage(message) {
  const tr = document.createElement("tr");
  const td = document.createElement("td");

  td.colSpan = 5;
  td.className = "message-cell";
  td.textContent = message;

  tr.appendChild(td);
  tbody.replaceChildren(tr);
}

// 検索・絞り込み結果を表示
function render() {
  const q = search.value.trim().toLocaleLowerCase();
  const selectedGroup = group.value;
  const selectedPage = page.value;

  const filtered = allItems.filter(x => {
    const matchesGroup =
      !selectedGroup || x.group === selectedGroup;

    const matchesPage =
      !selectedPage || x.page === selectedPage;

    const matchesSearch =
      [x.name, x.comment, x.page, x.group].some(v =>
        String(v || "").toLocaleLowerCase().includes(q)
      );

    return matchesGroup && matchesPage && matchesSearch;
  });

  // 日時不明の行は末尾に表示
  filtered.sort((a, b) => {
    const dateA = parseDate(a.date);
    const dateB = parseDate(b.date);

    if (dateA === null && dateB === null) return 0;
    if (dateA === null) return 1;
    if (dateB === null) return -1;

    return dateSortOrder === "asc"
      ? dateA - dateB
      : dateB - dateA;
  });

  statusEl.replaceChildren();

  const countBadge = document.createElement("span");
  countBadge.className = "count-badge";
  countBadge.textContent = filtered.length.toLocaleString();

  statusEl.appendChild(countBadge);
  statusEl.appendChild(
    document.createTextNode(
      `件 / 全 ${allItems.length.toLocaleString()} 件`
    )
  );

  tbody.replaceChildren();

  if (filtered.length === 0) {
    showEmptyMessage(
      allItems.length === 0
        ? "表示できるデータがありません。"
        : "条件に一致するファイルはありません。"
    );
    return;
  }

  const frag = document.createDocumentFragment();

  for (const x of filtered) {
    const tr = document.createElement("tr");

    const groupTd = document.createElement("td");
    groupTd.className = "group-column";
    groupTd.textContent = x.group || "";
    tr.appendChild(groupTd);

    const pageTd = document.createElement("td");
    pageTd.className = "page-column";
    pageTd.textContent = x.page || "";
    tr.appendChild(pageTd);

    const nameTd = document.createElement("td");
    nameTd.className = "name-column";

    if (x.url) {
      const a = document.createElement("a");
      a.className = "file-link";
      a.href = x.url;
      a.textContent = x.name || x.url;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      nameTd.appendChild(a);
    } else {
      nameTd.textContent = x.name || "";
    }

    tr.appendChild(nameTd);

    const commentTd = document.createElement("td");
    commentTd.className = "comment-column";
    commentTd.textContent = x.comment || "";
    tr.appendChild(commentTd);

    const dateTd = document.createElement("td");
    dateTd.className = "date-column";
    dateTd.textContent = x.date || "";
    tr.appendChild(dateTd);

    frag.appendChild(tr);
  }

  tbody.appendChild(frag);
}

// イベント設定
search.addEventListener("input", render);

group.addEventListener("change", () => {
  updatePages();
  render();
});

page.addEventListener("change", render);

/**
 * CSV読み込み
 * HTMLと同じフォルダの loader.csv を使用
 */
fetch("./loader.csv")
  .then(response => {
    if (!response.ok) {
      throw new Error("loader.csv を取得できません");
    }

    return response.text();
  })
  .then(text => {
    const data = parseCSV(text);

    if (data.length === 0) {
      allItems = [];
      updatePages();
      render();
      return;
    }

    const requiredColumns = [
      "group", "page", "url", "name", "comment", "date"
    ];

    const headers = Object.keys(data[0]);

    const missingColumns = requiredColumns.filter(
      key => !headers.includes(key)
    );

    if (missingColumns.length > 0) {
      throw new Error(
        "CSVの列名が不足しています: " + missingColumns.join(", ")
      );
    }

    allItems = data.map(item => ({
      group: item.group || "",
      page: item.page || "",
      url: item.url || "",
      name: item.name || "",
      comment: item.comment || "",
      date: item.date || ""
    }));

    updatePages();
    render();
  })
  .catch(error => {
    statusEl.textContent = "データを読み込めませんでした。";

    showEmptyMessage(
      "loader.csv が同じフォルダにあるか、CSVの列名・形式が正しいか確認してください。"
    );

    console.error("CSV読み込みエラー:", error);
  });
</script>

</body>
</html>
