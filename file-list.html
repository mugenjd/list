<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ターゲット倉庫 ファイル一覧</title>
<style>
:root { color-scheme: light dark; --line: #8885; --panel: #8881; --link: #3984e8; }
* { box-sizing: border-box; }
body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; line-height: 1.6; }
main { max-width: 1250px; margin: 0 auto; padding: 24px 16px 48px; }
h1 { font-size: clamp(1.5rem, 4vw, 2rem); margin: 0 0 8px; }
.note { color: #888; font-size: .92rem; margin: 0 0 20px; }
.controls { display: flex; gap: 10px; flex-wrap: wrap; margin: 16px 0; }
input, select { font: inherit; padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px; background: transparent; }
input { flex: 1 1 280px; min-width: 0; }
#count, #status { color: #888; font-size: .9rem; margin: 10px 0; }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
table { width: 100%; border-collapse: collapse; min-width: 760px; }
th, td { padding: 11px 13px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; }
th { background: var(--panel); white-space: nowrap; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr:hover { background: var(--panel); }
a { color: var(--link); overflow-wrap: anywhere; }
td.date { white-space: nowrap; font-variant-numeric: tabular-nums; }
td.warehouse { white-space: nowrap; }
.empty { padding: 24px; text-align: center; color: #888; }
footer { margin-top: 18px; color: #888; font-size: .85rem; }
</style>
</head>
<body>
<main>
  <h1>ターゲット倉庫 ファイル一覧</h1>
  <p class="note">ターゲット倉庫1〜16の一覧から、オリジナル名・日時・コメントを取得します。リンク先は各ファイルのダウンロードページです。</p>
  <div class="controls">
    <input id="search" type="search" placeholder="オリジナル・日時・コメント・倉庫名で検索">
    <select id="warehouse" aria-label="倉庫で絞り込み"><option value="">すべての倉庫</option></select>
    <select id="sort" aria-label="並び順">
      <option value="new">日時（新しい順）</option>
      <option value="old">日時（古い順）</option>
      <option value="name">オリジナル名順</option>
    </select>
  </div>
  <div id="count" aria-live="polite">データを読み込んでいます…</div>
  <div id="status" role="status"></div>
  <div class="table-wrap">
    <table>
      <thead><tr><th>オリジナル</th><th>日時</th><th>コメント</th><th>倉庫</th></tr></thead>
      <tbody id="rows"><tr><td colspan="4" class="empty">データを読み込んでいます…</td></tr></tbody>
    </table>
  </div>
  <footer>
    <p id="updated">最終更新日時：確認中</p>
    <p>このページは一覧情報のみを取得します。ファイル本体のダウンロードや保存は行いません。</p>
    <p><a href="https://uu.getuploader.com/mugen_target/">ターゲット倉庫1</a> ・ <a href="https://uu.getuploader.com/mugen_target2/">2</a> ・ <a href="https://uu.getuploader.com/mugen_target16/">16</a></p>
  </footer>
</main>
<script>
let files = [];
const search = document.getElementById('search');
const sort = document.getElementById('sort');
const warehouse = document.getElementById('warehouse');
const rows = document.getElementById('rows');
const count = document.getElementById('count');
const status = document.getElementById('status');
function dateKey(s) {
  const m = /^(\d{2})\/(\d{2})\/(\d{2})\s+(\d{2}):(\d{2})$/.exec(s || '');
  return m ? new Date(2000 + Number(m[1]), Number(m[2])-1, Number(m[3]), Number(m[4]), Number(m[5])).getTime() : 0;
}
function render() {
  const q = search.value.trim().toLocaleLowerCase();
  const selectedWarehouse = warehouse.value;
  let list = files.filter(f =>
    (!selectedWarehouse || f.warehouse === selectedWarehouse) &&
    [f.original, f.date, f.comment, f.warehouse].join(' ').toLocaleLowerCase().includes(q));
  if (sort.value === 'new') list.sort((a,b) => dateKey(b.date)-dateKey(a.date));
  if (sort.value === 'old') list.sort((a,b) => dateKey(a.date)-dateKey(b.date));
  if (sort.value === 'name') list.sort((a,b) => a.original.localeCompare(b.original, 'ja'));
  rows.replaceChildren();
  for (const f of list) {
    const tr = document.createElement('tr');
    const nameCell = document.createElement('td');
    const link = document.createElement('a');
    link.href = f.url; link.textContent = f.original || '(名称不明)';
    link.target = '_blank'; link.rel = 'noopener noreferrer';
    nameCell.append(link);
    const dateCell = document.createElement('td'); dateCell.className = 'date'; dateCell.textContent = f.date || '—';
    const commentCell = document.createElement('td'); commentCell.textContent = f.comment || '—';
    const warehouseCell = document.createElement('td'); warehouseCell.className = 'warehouse';
    const warehouseLink = document.createElement('a'); warehouseLink.href = f.warehouse_url; warehouseLink.textContent = f.warehouse;
    warehouseLink.target = '_blank'; warehouseLink.rel = 'noopener noreferrer'; warehouseCell.append(warehouseLink);
    tr.append(nameCell, dateCell, commentCell, warehouseCell); rows.append(tr);
  }
  count.textContent = `${list.length.toLocaleString('ja-JP')} 件表示 / 全 ${files.length.toLocaleString('ja-JP')} 件`;
  if (!list.length) {
    const tr = document.createElement('tr'); const td = document.createElement('td');
    td.colSpan = 4; td.className = 'empty'; td.textContent = '該当する項目がありません。'; tr.append(td); rows.append(tr);
  }
}
search.addEventListener('input', render); sort.addEventListener('change', render); warehouse.addEventListener('change', render);
fetch('./data.json', {cache: 'no-store'})
  .then(r => { if (!r.ok) throw new Error('data.json の読み込みに失敗しました'); return r.json(); })
  .then(data => {
    files = Array.isArray(data.files) ? data.files : [];
    const names = [...new Set(files.map(f => f.warehouse).filter(Boolean))].sort((a,b) => a.localeCompare(b, 'ja'));
    for (const name of names) { const opt = document.createElement('option'); opt.value = name; opt.textContent = name; warehouse.append(opt); }
    document.getElementById('updated').textContent = '最終更新日時：' + (data.updated_at || '自動取得の初回実行待ち');
    status.textContent = '';
    render();
  })
  .catch(err => { status.textContent = err.message; count.textContent = 'データを表示できません。'; });
</script>
</body>
</html>
