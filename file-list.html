<!doctype html>

<meta charset="utf-8">

<style>
:root { color-scheme: light dark; --line: #8885; --panel: #8881; --link: #3984e8; }
* { box-sizing: border-box; }
body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; line-height: 1.6; }
main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; }
h1 { font-size: clamp(1.5rem, 4vw, 2rem); margin: 0 0 8px; }
.note { color: #888; font-size: .92rem; margin: 0 0 20px; }
.controls { display: flex; gap: 10px; flex-wrap: wrap; margin: 16px 0; }
input, select, button { font: inherit; padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px; background: transparent; }
input { flex: 1 1 280px; min-width: 0; }
#count { color: #888; font-size: .9rem; margin: 10px 0; }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
table { width: 100%; border-collapse: collapse; min-width: 620px; }
th, td { padding: 11px 13px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; }
th { background: var(--panel); white-space: nowrap; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr:hover { background: var(--panel); }
a { color: var(--link); overflow-wrap: anywhere; }
td.date { white-space: nowrap; font-variant-numeric: tabular-nums; }
.empty { padding: 24px; text-align: center; color: #888; }
footer { margin-top: 18px; color: #888; font-size: .85rem; }
</style>
</head>

      <option value="old">日時（古い順）</option>
      <option value="name">ファイル名順</option>
    </select>

  <div id="count" aria-live="polite"></div>
  <div class="table-wrap">
    <table>
      <thead><tr><th>オリジナル</th><th>日時</th><th>コメント</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <footer>
    <p>この一覧は提供されたHTMLから抽出したデータです。元サイトの更新は自動反映されません。</p>
    <p><a href="https://uu.getuploader.com/mugen_target/">元のアップローダーを開く</a></p>
  </footer>
</main>

const search = document.getElementById('search');
const sort = document.getElementById('sort');
const rows = document.getElementById('rows');
const count = document.getElementById('count');

function dateKey(s) {
  const [d, t] = s.split(' ');
  const [yy, mm, dd] = d.split('/').map(Number);
  return new Date(2000 + yy, mm - 1, dd, ...(t || '00:00').split(':').map(Number)).getTime();
}
function render() {
  const q = search.value.trim().toLocaleLowerCase();
  let list = files.filter(f => [f.original, f.date, f.comment].join(' ').toLocaleLowerCase().includes(q));
  if (sort.value === 'new') list.sort((a,b) => dateKey(b.date)-dateKey(a.date));
  if (sort.value === 'old') list.sort((a,b) => dateKey(a.date)-dateKey(b.date));
  if (sort.value === 'name') list.sort((a,b) => a.original.localeCompare(b.original, 'ja'));
  rows.replaceChildren();
  for (const f of list) {
    const tr = document.createElement('tr');
    const nameCell = document.createElement('td');
    const link = document.createElement('a');
    link.href = f.url; link.textContent = f.original;
    link.target = '_blank'; link.rel = 'noopener noreferrer';
    nameCell.append(link);
    const dateCell = document.createElement('td');
    dateCell.className = 'date'; dateCell.textContent = f.date;
    const commentCell = document.createElement('td');
    commentCell.textContent = f.comment || '—';
    tr.append(nameCell, dateCell, commentCell);
    rows.append(tr);
  }
  count.textContent = `${list.length} 件 / 全 ${files.length} 件`;
  if (!list.length) {
    const tr = document.createElement('tr');
    const td = document.createElement('td');
    td.colSpan = 3; td.className = 'empty'; td.textContent = '該当する項目がありません。';
    tr.append(td); rows.append(tr);
  }
}
search.addEventListener('input', render);
sort.addEventListener('change', render);
render();
</script>
</body>
</html>
