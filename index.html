
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>動画カタログ</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: sans-serif;
      background: #f4f5f7;
      color: #222;
    }

    header {
      background: #24292f;
      color: white;
      padding: 24px 16px;
    }

    header h1 {
      max-width: 1200px;
      margin: 0 auto;
    }

    main {
      max-width: 1200px;
      margin: 24px auto;
      padding: 0 16px;
    }

    #video-count {
      margin-bottom: 16px;
      color: #555;
    }

    .video-list {
      display: grid;
      grid-template-columns: repeat(
        auto-fill, minmax(260px, 1fr)
      );
      gap: 20px;
    }

    .video-card {
      background: white;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 8px #00000012;
    }

    .player {
      aspect-ratio: 16 / 9;
      background: #ddd;
      position: relative;
    }

    .player img,
    .player iframe {
      width: 100%;
      height: 100%;
      display: block;
      border: 0;
      object-fit: cover;
    }

    .play-button {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #e62117;
      color: white;
      border: 0;
      border-radius: 12px;
      padding: 12px 20px;
      font-size: 20px;
      cursor: pointer;
    }

    .video-info {
      padding: 16px;
    }

    .video-info h2 {
      font-size: 18px;
      margin: 0 0 10px;
    }

    .game {
      color: #555;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tag {
      background: #e8eef8;
      color: #244d85;
      padding: 4px 8px;
      border-radius: 5px;
      font-size: 12px;
    }

    footer {
      text-align: center;
      padding: 30px 12px;
      color: #666;
    }
  </style>
</head>

<body>
  <header>
    <h1>動画カタログ</h1>
  </header>

  <main>
    <p id="video-count"></p>
    <div id="video-list" class="video-list"></div>
  </main>

  <footer>動画カタログ</footer>

  <script>
    // 動画データ：ここに動画を追加します
    const videos = [
      {
        title: "ギャラクティックナイト",
        game: "演出用動画",
        tags: ["星のカービィ", "何処かのTZ氏"],
        id: "RQq9AXml4As"
      },
      {
        title: "サンプル動画2",
        game: "ゲーム名B",
        tags: ["解説"],
        id: "M7lc1UVf-VE"
      },
      {
        title: "サンプル動画3",
        game: "ゲーム名A",
        tags: ["プレイ動画", "検証"],
        id: "M7lc1UVf-VE"
      }
    ];

    const list = document.getElementById("video-list");

    document.getElementById("video-count").textContent =
      "登録動画数：" + videos.length + "件";

    videos.forEach(video => {
      const card = document.createElement("article");
      card.className = "video-card";

      const player = document.createElement("div");
      player.className = "player";

      const thumbnail = document.createElement("img");
      thumbnail.src =
        "https://i.ytimg.com/vi/" + video.id + "/hqdefault.jpg";
      thumbnail.alt = video.title + "のサムネイル";
      thumbnail.loading = "lazy";

      const button = document.createElement("button");
      button.className = "play-button";
      button.textContent = "▶ 再生";
      button.setAttribute("aria-label", video.title + "を再生");

      button.addEventListener("click", () => {
        const iframe = document.createElement("iframe");
        iframe.src =
          "https://www.youtube-nocookie.com/embed/" +
          encodeURIComponent(video.id) +
          "?autoplay=1";
        iframe.title = video.title;
        iframe.allow =
          "accelerometer; autoplay; clipboard-write; " +
          "encrypted-media; gyroscope; picture-in-picture; web-share";
        iframe.allowFullscreen = true;

        player.replaceChildren(iframe);
      });

      player.append(thumbnail, button);

      const info = document.createElement("div");
      info.className = "video-info";

      const title = document.createElement("h2");
      title.textContent = video.title;

      const game = document.createElement("div");
      game.className = "game";
      game.textContent = "ゲーム：" + video.game;

      const tags = document.createElement("div");
      tags.className = "tags";

      video.tags.forEach(tagText => {
        const tag = document.createElement("span");
        tag.className = "tag";
        tag.textContent = tagText;
        tags.appendChild(tag);
      });

      info.append(title, game, tags);
      card.append(player, info);
      list.appendChild(card);
    });
  </script>
</body>
</html>
