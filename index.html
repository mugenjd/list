
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YouTube動画カタログ</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      max-width: 1200px;
      margin: 0 auto 24px;
    }

    h1 {
      margin-bottom: 8px;
    }

    .search-panel {
      max-width: 1200px;
      margin: 0 auto 20px;
      padding: 16px;
      background: white;
      border-radius: 8px;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .search-panel input,
    .search-panel select,
    .search-panel button {
      width: 100%;
      min-width: 0;
      padding: 10px;
      font-size: 15px;
      border: 1px solid #ccc;
      border-radius: 5px;
      background: white;
    }

    .search-panel button {
      cursor: pointer;
      background: #333;
      color: white;
      border: none;
    }

    .search-panel button:hover {
      background: #555;
    }

    #status {
      max-width: 1200px;
      margin: 0 auto 16px;
      line-height: 1.6;
    }

    .video-list {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(
        auto-fill,
        minmax(min(100%, 280px), 1fr)
      );
      gap: 18px;
    }

    .video-card {
      min-width: 0;
      padding: 12px;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 5px #00000012;
    }

    .thumbnail {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      background: #ddd;
      border-radius: 5px;
    }

    .video-title {
      margin: 12px 0 8px;
      font-size: 17px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    /* クリックできる分類名 */
    .video-class {
      display: inline-block;
      padding: 4px 8px;
      margin-bottom: 8px;
      background: #e8e8e8;
      color: #333;
      border: none;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
    }

    .video-class:hover {
      background: #d0d0d0;
      text-decoration: underline;
    }

    .video-class:focus-visible {
      outline: 2px solid #555;
      outline-offset: 2px;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin: 4px 0 12px;
    }

    /* クリックできるタグ */
    .tag {
      padding: 4px 7px;
      background: #eaf2ff;
      color: #2454a6;
      border: none;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
    }

    .tag:hover {
      background: #cfe0ff;
      text-decoration: underline;
    }

    .tag:focus-visible {
      outline: 2px solid #2454a6;
      outline-offset: 2px;
    }

    .play-button {
      width: 100%;
      padding: 10px;
      color: white;
      background: #d92727;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 15px;
    }

    .play-button:hover {
      background: #ad1d1d;
    }

    .player {
      width: 100%;
      margin-top: 10px;
      aspect-ratio: 16 / 9;
      background: #111;
      border-radius: 5px;
      overflow: hidden;
    }

    .player iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    .pagination {
      max-width: 1200px;
      margin: 24px auto;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .pagination button {
      padding: 10px 16px;
      border: none;
      border-radius: 5px;
      background: #333;
      color: white;
      cursor: pointer;
    }

    .pagination button:disabled {
      background: #bbb;
      cursor: not-allowed;
    }

    #page-info {
      font-weight: bold;
    }

    .message {
      max-width: 1200px;
      margin: 20px auto;
      padding: 16px;
      background: white;
      border-radius: 8px;
      line-height: 1.7;
      overflow-wrap: anywhere;
    }

    @media (max-width: 700px) {
      body {
        padding: 12px;
      }

      .search-panel {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>YouTube動画カタログ</h1>
    <p>キーワード・分類・タグから動画を検索できます。</p>
  </header>

  <section class="search-panel">
    <input
      id="keyword"
      type="search"
      placeholder="タイトル・分類・タグで検索"
      aria-label="キーワード検索"
    >

    <select id="class-filter" aria-label="分類で絞り込み">
      <option value="">すべての分類</option>
    </select>

    <select id="tag-filter" aria-label="タグで絞り込み">
      <option value="">すべてのタグ</option>
    </select>

    <button id="reset-search" type="button">
      検索条件をリセット
    </button>
  </section>

  <div id="status" role="status" aria-live="polite">
    動画データを読み込んでいます……
  </div>

  <div id="video-list" class="video-list"></div>

  <nav class="pagination" aria-label="ページ移動">
    <button id="prev-page" type="button" disabled>
      前のページ
    </button>

    <span id="page-info">ページ 0 / 0</span>

    <button id="next-page" type="button" disabled>
      次のページ
    </button>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.5.3/papaparse.min.js"></script>

  <script>
    "use strict";

    // ===== 設定 =====

    const CSV_FILE = "./videos.csv";
    const ITEMS_PER_PAGE = 50;

    let videos = [];
    let currentPage = 1;
    let loadError = false;

    // ===== HTML要素 =====

    const keywordInput = document.getElementById("keyword");
    const classFilter = document.getElementById("class-filter");
    const tagFilter = document.getElementById("tag-filter");
    const resetButton = document.getElementById("reset-search");

    const videoList = document.getElementById("video-list");
    const status = document.getElementById("status");
    const pageInfo = document.getElementById("page-info");
    const prevButton = document.getElementById("prev-page");
    const nextButton = document.getElementById("next-page");

    // ===== YouTube動画IDの取得 =====

    function normalizeVideoId(value) {
      const input = String(value || "").trim();

      try {
        const url = new URL(input);

        if (
          url.hostname === "youtu.be" ||
          url.hostname.endsWith(".youtu.be")
        ) {
          return url.pathname.split("/").filter(Boolean)[0] || "";
        }

        if (
          url.hostname === "youtube.com" ||
          url.hostname.endsWith(".youtube.com") ||
          url.hostname === "youtube-nocookie.com" ||
          url.hostname.endsWith(".youtube-nocookie.com")
        ) {
          if (url.pathname === "/watch") {
            return url.searchParams.get("v") || "";
          }

          const match = url.pathname.match(
            /^\/(?:embed|shorts|live)\/([^/?]+)/
          );

          if (match) {
            return match[1];
          }
        }
      } catch (_) {
        // URLでなければ動画IDとして扱う
      }

      return input;
    }

    // ===== CSV読み込み =====

    async function loadVideos() {
      status.textContent = "動画データを読み込んでいます……";

      try {
        if (typeof Papa === "undefined") {
          throw new Error(
            "CSV解析ライブラリを読み込めませんでした。"
          );
        }

        const response = await fetch(CSV_FILE, {
          cache: "no-cache"
        });

        if (!response.ok) {
          throw new Error(
            "videos.csv を取得できませんでした。HTTP " +
            response.status
          );
        }

        const csvText = await response.text();

        const result = Papa.parse(csvText, {
          header: true,
          skipEmptyLines: "greedy",
          transformHeader: header => header.trim()
        });

        const fields = result.meta.fields || [];
        const requiredFields = ["title", "class", "tags", "id"];

        const missingFields = requiredFields.filter(
          field => !fields.includes(field)
        );

        if (missingFields.length > 0) {
          throw new Error(
            "CSVの項目名が不足しています: " +
            missingFields.join(", ")
          );
        }

        videos = result.data
          .map(row => ({
            title: String(row.title || "").trim(),
            class: String(row.class || "").trim(),
            tags: String(row.tags || "")
              .split("|")
              .map(tag => tag.trim())
              .filter(Boolean),
            id: normalizeVideoId(row.id)
          }))
          .filter(video => video.title && video.id);

        if (result.errors.length > 0) {
          console.warn("CSV解析時の警告:", result.errors);
        }

        if (videos.length === 0) {
          throw new Error(
            "有効な動画データがありません。CSVを確認してください。"
          );
        }

        loadError = false;

        buildFilters();
        renderVideos();

      } catch (error) {
        console.error(error);

        loadError = true;
        videos = [];
        videoList.replaceChildren();

        status.textContent =
          "動画データを読み込めませんでした。";

        const message = document.createElement("div");
        message.className = "message";
        message.textContent =
          error.message +
          " GitHubに videos.csv があり、index.html と同じ階層にあるか確認してください。";

        videoList.appendChild(message);

        updatePagination(0, 0);
      }
    }

    // ===== 分類の選択肢を作成 =====

    function buildFilters() {
      const classes = [...new Set(
        videos.map(video => video.class).filter(Boolean)
      )].sort((a, b) => a.localeCompare(b, "ja"));

      classFilter.replaceChildren();

      const allClasses = document.createElement("option");
      allClasses.value = "";
      allClasses.textContent = "すべての分類";
      classFilter.appendChild(allClasses);

      classes.forEach(value => {
        const option = document.createElement("option");
        option.value = value;
        option.textContent = value;
        classFilter.appendChild(option);
      });

      // 初期状態のタグ候補を作成
      updateTagFilter();
    }

    // ===== 分類に応じてタグ候補を更新 =====

    function updateTagFilter() {
      const selectedClass = classFilter.value;
      const previousTag = tagFilter.value;

      // 分類が選択されている場合は、その分類の動画だけを対象にする
      const classVideos = selectedClass
        ? videos.filter(video => video.class === selectedClass)
        : videos;

      // 対象の動画に存在するタグだけを抽出
      const tags = [...new Set(
        classVideos.flatMap(video => video.tags)
      )].sort((a, b) => a.localeCompare(b, "ja"));

      tagFilter.replaceChildren();

      const allTags = document.createElement("option");
      allTags.value = "";
      allTags.textContent = "すべてのタグ";
      tagFilter.appendChild(allTags);

      tags.forEach(value => {
        const option = document.createElement("option");
        option.value = value;
        option.textContent = value;
        tagFilter.appendChild(option);
      });

      // 変更後の分類にも存在するタグなら選択を維持
      if (tags.includes(previousTag)) {
        tagFilter.value = previousTag;
      } else {
        // 存在しないタグは解除
        tagFilter.value = "";
      }
    }

    // ===== 検索・絞り込み =====

    function getFilteredVideos() {
      const keyword = keywordInput.value
        .trim()
        .toLocaleLowerCase("ja");

      const selectedClass = classFilter.value;
      const selectedTag = tagFilter.value;

      return videos.filter(video => {
        const searchableText = [
          video.title,
          video.class,
          ...video.tags,
          video.id
        ].join(" ").toLocaleLowerCase("ja");

        const matchesKeyword =
          !keyword || searchableText.includes(keyword);

        const matchesClass =
          !selectedClass || video.class === selectedClass;

        const matchesTag =
          !selectedTag || video.tags.includes(selectedTag);

        return (
          matchesKeyword &&
          matchesClass &&
          matchesTag
        );
      });
    }

    // ===== 動画カード =====

    function createVideoCard(video) {
      const card = document.createElement("article");
      card.className = "video-card";

      // サムネイル
      const thumbnail = document.createElement("img");
      thumbnail.className = "thumbnail";
      thumbnail.src =
        "https://i.ytimg.com/vi/" +
        encodeURIComponent(video.id) +
        "/hqdefault.jpg";
      thumbnail.alt = video.title;
      thumbnail.loading = "lazy";
      thumbnail.decoding = "async";

      thumbnail.addEventListener("error", () => {
        thumbnail.style.display = "none";
      }, { once: true });

      card.appendChild(thumbnail);

      // タイトル
      const title = document.createElement("h2");
      title.className = "video-title";
      title.textContent = video.title;
      card.appendChild(title);

      // 分類名をクリックすると、その分類で絞り込む
      if (video.class) {
        const classLabel = document.createElement("button");

        classLabel.className = "video-class";
        classLabel.type = "button";
        classLabel.textContent = video.class;
        classLabel.title =
          "分類「" + video.class + "」で絞り込む";

        classLabel.addEventListener("click", () => {
          classFilter.value = video.class;

          // 分類変更に応じてタグ候補を更新
          updateTagFilter();

          currentPage = 1;
          renderVideos();

          window.scrollTo({
            top: 0,
            behavior: "smooth"
          });
        });

        card.appendChild(classLabel);
      }

      // タグをクリックすると、そのタグで絞り込む
      if (video.tags.length > 0) {
        const tagsContainer = document.createElement("div");
        tagsContainer.className = "tags";

        video.tags.forEach(tag => {
          const tagElement = document.createElement("button");

          tagElement.className = "tag";
          tagElement.type = "button";
          tagElement.textContent = tag;
          tagElement.title =
            "タグ「" + tag + "」で絞り込む";

          tagElement.addEventListener("click", () => {
            // タグが現在の分類候補に存在することを確認
            const availableTags = [
              ...tagFilter.options
            ].map(option => option.value);

            if (!availableTags.includes(tag)) {
              classFilter.value = "";
              updateTagFilter();
            }

            tagFilter.value = tag;
            currentPage = 1;
            renderVideos();

            window.scrollTo({
              top: 0,
              behavior: "smooth"
            });
          });

          tagsContainer.appendChild(tagElement);
        });

        card.appendChild(tagsContainer);
      }

      // 再生ボタン
      const playButton = document.createElement("button");
      playButton.className = "play-button";
      playButton.type = "button";
      playButton.textContent = "▶ 再生";

      const player = document.createElement("div");
      player.className = "player";
      player.hidden = true;

      // クリックされるまでiframeを読み込まない
      playButton.addEventListener("click", () => {
        if (player.dataset.loaded === "true") {
          player.hidden = !player.hidden;
          playButton.textContent = player.hidden
            ? "▶ 再生"
            : "プレイヤーを隠す";
          return;
        }

        const iframe = document.createElement("iframe");

        iframe.src =
          "https://www.youtube-nocookie.com/embed/" +
          encodeURIComponent(video.id) +
          "?autoplay=1";

        iframe.title = video.title;
        iframe.loading = "lazy";
        iframe.allow =
          "accelerometer; autoplay; clipboard-write; " +
          "encrypted-media; gyroscope; picture-in-picture; web-share";
        iframe.allowFullscreen = true;
        iframe.referrerPolicy = "strict-origin-when-cross-origin";

        player.appendChild(iframe);
        player.dataset.loaded = "true";
        player.hidden = false;

        playButton.textContent = "プレイヤーを隠す";
      });

      card.appendChild(playButton);
      card.appendChild(player);

      return card;
    }

    // ===== ページネーション =====

    function updatePagination(totalItems, totalPages) {
      pageInfo.textContent =
        "ページ " +
        (totalPages === 0 ? 0 : currentPage) +
        " / " + totalPages;

      prevButton.disabled =
        loadError || currentPage <= 1;

      nextButton.disabled =
        loadError ||
        totalPages === 0 ||
        currentPage >= totalPages;
    }

    // ===== 一覧表示 =====

    function renderVideos() {
      if (loadError) {
        return;
      }

      const filteredVideos = getFilteredVideos();
      const totalItems = filteredVideos.length;
      const totalPages = Math.ceil(
        totalItems / ITEMS_PER_PAGE
      );

      if (totalPages === 0) {
        currentPage = 1;
      } else {
        currentPage = Math.min(currentPage, totalPages);
        currentPage = Math.max(currentPage, 1);
      }

      const startIndex =
        (currentPage - 1) * ITEMS_PER_PAGE;

      const pageVideos = filteredVideos.slice(
        startIndex,
        startIndex + ITEMS_PER_PAGE
      );

      videoList.replaceChildren();

      pageVideos.forEach(video => {
        videoList.appendChild(createVideoCard(video));
      });

      status.textContent =
        "登録動画: " +
        videos.length.toLocaleString("ja-JP") +
        "件 ／ 検索結果: " +
        totalItems.toLocaleString("ja-JP") +
        "件";

      if (totalItems === 0) {
        const message = document.createElement("div");
        message.className = "message";
        message.textContent =
          "該当する動画がありません。検索条件を変更してください。";
        videoList.appendChild(message);
      }

      updatePagination(totalItems, totalPages);
    }

    // ===== イベント設定 =====

    keywordInput.addEventListener("input", () => {
      currentPage = 1;
      renderVideos();
    });

    classFilter.addEventListener("change", () => {
      // 分類変更時にタグ候補も更新
      updateTagFilter();

      currentPage = 1;
      renderVideos();
    });

    tagFilter.addEventListener("change", () => {
      currentPage = 1;
      renderVideos();
    });

    resetButton.addEventListener("click", () => {
      keywordInput.value = "";
      classFilter.value = "";

      // 全分類に戻してからタグ候補を更新
      updateTagFilter();

      tagFilter.value = "";
      currentPage = 1;
      renderVideos();
    });

    prevButton.addEventListener("click", () => {
      if (currentPage > 1) {
        currentPage--;
        renderVideos();

        window.scrollTo({
          top: 0,
          behavior: "smooth"
        });
      }
    });

    nextButton.addEventListener("click", () => {
      const totalPages = Math.ceil(
        getFilteredVideos().length / ITEMS_PER_PAGE
      );

      if (currentPage < totalPages) {
        currentPage++;
        renderVideos();

        window.scrollTo({
          top: 0,
          behavior: "smooth"
        });
      }
    });

    // ===== 起動 =====

    loadVideos();
  </script>
</body>
</html>
