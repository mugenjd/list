
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>検索用</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: sans-serif;
      background: #f4f5f7;
      color: #222;
    }

    header {
      background: #24292f;
      color: white;
      padding: 24px 16px;
    }

    header h1 {
      max-width: 1200px;
      margin: 0 auto;
    }

    main {
      max-width: 1200px;
      margin: 24px auto;
      padding: 0 16px;
    }

    #video-count {
      margin-bottom: 16px;
      color: #555;
    }

    .video-list {
      display: grid;
      grid-template-columns: repeat(
        auto-fill, minmax(260px, 1fr)
      );
      gap: 20px;
    }

    .video-card {
      background: white;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 8px #00000012;
    }

    .player {
      aspect-ratio: 16 / 9;
      background: #ddd;
      position: relative;
    }

    .player img,
    .player iframe {
      width: 100%;
      height: 100%;
      display: block;
      border: 0;
      object-fit: cover;
    }

    .play-button {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #e62117;
      color: white;
      border: 0;
      border-radius: 12px;
      padding: 12px 20px;
      font-size: 20px;
      cursor: pointer;
    }

    .video-info {
      padding: 16px;
    }

    .video-info h2 {
      font-size: 18px;
      margin: 0 0 10px;
    }

    .game {
      color: #555;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tag {
      background: #e8eef8;
      color: #244d85;
      padding: 4px 8px;
      border-radius: 5px;
      font-size: 12px;
    }

    footer {
      text-align: center;
      padding: 30px 12px;
      color: #666;
    }
    
.search-panel {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 12px;
  margin-bottom: 20px;
}

.search-panel input,
.search-panel select,
.search-panel button {
  width: 100%;
  min-width: 0;
  padding: 12px;
  border: 1px solid #ccc;
  border-radius: 6px;
  background: white;
  font-size: 15px;
}

.search-panel button {
  background: #24292f;
  color: white;
  cursor: pointer;
}

#video-count {
  font-weight: bold;
}

  </style>
</head>

<body>
  <header>
    <h1>検索用</h1>
  </header>


<main>
  <div class="search-panel">
    <input
      type="search"
      id="keyword"
      placeholder="タイトル・ゲーム名・タグで検索"
    >

    <select id="game-filter">
      <option value="">すべてのゲーム</option>
    </select>

    <select id="tag-filter">
      <option value="">すべてのタグ</option>
    </select>

    <button id="reset-search" type="button">
      検索条件をリセット
    </button>
  </div>

  <p id="video-count"></p>
  <div id="video-list" class="video-list"></div>
</main>


  <footer>検索用</footer>

  <script>
    // 動画データ：ここに動画を追加します
    const videos = [
      {
        title: "ギャラクティックナイト",
        game: "演出用動画",
        tags: ["星のカービィ", "何処かのTZ氏"],
        id: "RQq9AXml4As"
      }
      ];
const list = document.getElementById("video-list");
const count = document.getElementById("video-count");
const keyword = document.getElementById("keyword");
const gameFilter = document.getElementById("game-filter");
const tagFilter = document.getElementById("tag-filter");
const resetButton = document.getElementById("reset-search");

// ゲーム名とタグの選択肢を自動作成
const games = [...new Set(videos.map(v => v.game))]
  .filter(Boolean)
  .sort();

const tags = [...new Set(videos.flatMap(v => v.tags || []))]
  .filter(Boolean)
  .sort();

games.forEach(game => {
  const option = document.createElement("option");
  option.value = game;
  option.textContent = game;
  gameFilter.appendChild(option);
});

tags.forEach(tag => {
  const option = document.createElement("option");
  option.value = tag;
  option.textContent = tag;
  tagFilter.appendChild(option);
});

// 検索と一覧表示
function renderVideos() {
  const query = keyword.value.trim().toLowerCase();
  const selectedGame = gameFilter.value;
  const selectedTag = tagFilter.value;

  const filtered = videos.filter(video => {
    const searchableText = [
      video.title,
      video.game,
      ...(video.tags || [])
    ].join(" ").toLowerCase();

    return (
      searchableText.includes(query) &&
      (!selectedGame || video.game === selectedGame) &&
      (!selectedTag || (video.tags || []).includes(selectedTag))
    );
  });

  count.textContent =
    `表示件数：${filtered.length}件 / 全${videos.length}件`;

  list.replaceChildren();

  if (filtered.length === 0) {
    const message = document.createElement("p");
    message.textContent = "該当する動画がありません。";
    list.appendChild(message);
    return;
  }

  filtered.forEach(video => {
    const card = document.createElement("article");
    card.className = "video-card";

    const player = document.createElement("div");
    player.className = "player";

    const thumbnail = document.createElement("img");
    thumbnail.src =
      `https://i.ytimg.com/vi/${encodeURIComponent(video.id)}/hqdefault.jpg`;
    thumbnail.alt = `${video.title}のサムネイル`;
    thumbnail.loading = "lazy";

    const button = document.createElement("button");
    button.className = "play-button";
    button.textContent = "▶ 再生";
    button.setAttribute("aria-label", `${video.title}を再生`);

    button.addEventListener("click", () => {
      const iframe = document.createElement("iframe");
      iframe.src =
        `https://www.youtube-nocookie.com/embed/${encodeURIComponent(video.id)}?autoplay=1`;
      iframe.title = video.title;
      iframe.allow =
        "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
      iframe.allowFullscreen = true;
      player.replaceChildren(iframe);
    });

    player.append(thumbnail, button);

    const info = document.createElement("div");
    info.className = "video-info";

    const title = document.createElement("h2");
    title.textContent = video.title;

    const game = document.createElement("div");
    game.className = "game";
    game.textContent = `ゲーム：${video.game}`;

    const tagContainer = document.createElement("div");
    tagContainer.className = "tags";

    (video.tags || []).forEach(tagText => {
      const tag = document.createElement("span");
      tag.className = "tag";
      tag.textContent = tagText;
      tagContainer.appendChild(tag);
    });

    info.append(title, game, tagContainer);
    card.append(player, info);
    list.appendChild(card);
  });
}

// 条件が変更されたら自動で再検索
keyword.addEventListener("input", renderVideos);
gameFilter.addEventListener("change", renderVideos);
tagFilter.addEventListener("change", renderVideos);

resetButton.addEventListener("click", () => {
  keyword.value = "";
  gameFilter.value = "";
  tagFilter.value = "";
  renderVideos();
});

// 初期表示
renderVideos();
  </script>
</body>
</html>
