
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube動画カタログ</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    h1 {
      margin-top: 0;
      font-size: 28px;
    }

    .search-area {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
      margin-bottom: 15px;
    }

    input,
    select,
    button {
      font: inherit;
    }

    input,
    select {
      width: 100%;
      min-width: 0;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      background: #fff;
    }

    button {
      padding: 8px 12px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.8;
    }

    #reset-search {
      background: #555;
      color: #fff;
    }

    #status {
      margin: 15px 0;
      color: #555;
    }

    #video-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }

    .video-card {
      min-width: 0;
      padding: 12px;
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
    }

    .thumbnail-link {
      display: block;
      overflow: hidden;
      border-radius: 5px;
      background: #eee;
    }

    .thumbnail {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      transition: opacity 0.2s;
    }

    .thumbnail-link:hover .thumbnail {
      opacity: 0.8;
    }

    .video-title {
      margin: 12px 0 8px;
      font-size: 16px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .video-class {
      margin: 0 0 8px;
      padding: 5px 9px;
      background: #e5e5e5;
      color: #333;
      font-size: 13px;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 12px;
    }

    .tag {
      padding: 5px 8px;
      border-radius: 15px;
      background: #e8f1ff;
      color: #1454a3;
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    .play-button {
      width: 100%;
      background: #d92323;
      color: #fff;
    }

    .player {
      margin-top: 10px;
    }

    .player iframe {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      border: 0;
      border-radius: 5px;
    }

    .pagination {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin: 25px 0;
    }

    .pagination button {
      background: #333;
      color: #fff;
    }

    .pagination button:disabled {
      background: #ccc;
      color: #666;
      cursor: not-allowed;
      opacity: 1;
    }

    #page-info {
      min-width: 90px;
      text-align: center;
    }

    .empty-message {
      grid-column: 1 / -1;
      padding: 30px;
      text-align: center;
      color: #666;
      background: #fff;
      border-radius: 8px;
    }

    @media (max-width: 600px) {
      body {
        padding: 12px;
      }

      h1 {
        font-size: 23px;
      }

      #video-list {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <h1>YouTube動画カタログ</h1>

  <div class="search-area">
    <input
      type="search"
      id="keyword"
      placeholder="キーワードで検索"
    >

    <select id="class-filter">
      <option value="">すべての分類</option>
    </select>

    <select id="tag-filter">
      <option value="">すべてのタグ</option>
    </select>

    <button type="button" id="reset-search">
      検索条件をリセット
    </button>
  </div>

  <div id="status">CSVを読み込んでいます...</div>

  <div id="video-list"></div>

  <div class="pagination">
    <button type="button" id="prev-page" disabled>
      前のページ
    </button>

    <span id="page-info">1 / 1</span>

    <button type="button" id="next-page" disabled>
      次のページ
    </button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.5.3/papaparse.min.js"></script>

  <script>
    const keywordInput = document.getElementById("keyword");
    const classFilter = document.getElementById("class-filter");
    const tagFilter = document.getElementById("tag-filter");
    const resetButton = document.getElementById("reset-search");
    const statusElement = document.getElementById("status");
    const videoList = document.getElementById("video-list");
    const prevButton = document.getElementById("prev-page");
    const nextButton = document.getElementById("next-page");
    const pageInfo = document.getElementById("page-info");

    const PAGE_SIZE = 50;

    let videos = [];
    let currentPage = 1;

    // CSVの値を文字列に統一する
    function cleanValue(value) {
      return String(value ?? "").trim();
    }

    // YouTubeのURLまたは動画IDから動画IDを取得する
    function normalizeVideoId(value) {
      const text = cleanValue(value);

      if (!text) {
        return "";
      }

      // URLではなく動画IDが直接入力されている場合
      if (!text.includes("://")) {
        return text;
      }

      try {
        const url = new URL(text);
        const hostname = url.hostname.toLowerCase();
        let id = "";

        if (
          hostname === "youtu.be" ||
          hostname === "www.youtu.be"
        ) {
          id = url.pathname.split("/").filter(Boolean)[0] || "";
        } else if (
          hostname === "youtube.com" ||
          hostname.endsWith(".youtube.com")
        ) {
          if (url.pathname === "/watch") {
            id = url.searchParams.get("v") || "";
          } else {
            const parts = url.pathname.split("/").filter(Boolean);

            if (
              parts.length >= 2 &&
              ["embed", "shorts", "live", "v"].includes(parts[0])
            ) {
              id = parts[1];
            }
          }
        }

        return id;
      } catch (error) {
        return text;
      }
    }

    // タグ欄を配列にする。複数タグは | 区切り
    function getVideoTags(video) {
      return cleanValue(video.tags)
        .split("|")
        .map(tag => tag.trim())
        .filter(Boolean);
    }

    // 分類とタグの選択肢を作成する
    function buildFilters() {
      const classes = [...new Set(
        videos
          .map(video => video.class)
          .filter(Boolean)
      )].sort((a, b) => a.localeCompare(b, "ja"));

      classFilter.innerHTML = '<option value="">すべての分類</option>';

      classes.forEach(name => {
        const option = document.createElement("option");
        option.value = name;
        option.textContent = name;
        classFilter.appendChild(option);
      });

      updateTagFilter();
    }

    // 選択中の分類に存在するタグだけを候補にする
    function updateTagFilter() {
      const previousTag = tagFilter.value;
      const selectedClass = classFilter.value;

      const relevantVideos = selectedClass
        ? videos.filter(video => video.class === selectedClass)
        : videos;

      const tags = [...new Set(
        relevantVideos.flatMap(video => getVideoTags(video))
      )].sort((a, b) => a.localeCompare(b, "ja"));

      tagFilter.innerHTML = '<option value="">すべてのタグ</option>';

      tags.forEach(tag => {
        const option = document.createElement("option");
        option.value = tag;
        option.textContent = tag;
        tagFilter.appendChild(option);
      });

      // 選択中のタグが引き続き有効なら維持する
      if (tags.includes(previousTag)) {
        tagFilter.value = previousTag;
      } else {
        tagFilter.value = "";
      }
    }

    // 現在の検索条件に合う動画を取得する
    function getFilteredVideos() {
      const keyword = keywordInput.value.trim().toLocaleLowerCase();
      const selectedClass = classFilter.value;
      const selectedTag = tagFilter.value;

      return videos.filter(video => {
        const searchableText = [
          video.title,
          video.class,
          video.tags,
          video.id
        ].join(" ").toLocaleLowerCase();

        const matchesKeyword =
          !keyword || searchableText.includes(keyword);

        const matchesClass =
          !selectedClass || video.class === selectedClass;

        const matchesTag =
          !selectedTag || getVideoTags(video).includes(selectedTag);

        return matchesKeyword && matchesClass && matchesTag;
      });
    }

    // 動画カードを作成する
    function createVideoCard(video) {
      const card = document.createElement("article");
      card.className = "video-card";

      // サムネイルをYouTube動画へのリンクにする
      const thumbnailLink = document.createElement("a");
      thumbnailLink.className = "thumbnail-link";
      thumbnailLink.href =
        `https://www.youtube.com/watch?v=${encodeURIComponent(video.id)}`;
      thumbnailLink.target = "_blank";
      thumbnailLink.rel = "noopener noreferrer";
      thumbnailLink.setAttribute(
        "aria-label",
        `${video.title} をYouTubeで開く`
      );

      const thumbnail = document.createElement("img");
      thumbnail.className = "thumbnail";
      thumbnail.src =
        `https://i.ytimg.com/vi/${encodeURIComponent(video.id)}/hqdefault.jpg`;
      thumbnail.alt = `${video.title} のサムネイル`;
      thumbnail.loading = "lazy";
      thumbnail.decoding = "async";

      thumbnailLink.appendChild(thumbnail);
      card.appendChild(thumbnailLink);

      // 動画タイトル
      const title = document.createElement("h2");
      title.className = "video-title";
      title.textContent = video.title || "タイトル未設定";
      card.appendChild(title);

      // 分類ボタン
      if (video.class) {
        const classButton = document.createElement("button");
        classButton.type = "button";
        classButton.className = "video-class";
        classButton.textContent = video.class;
        classButton.title = `分類「${video.class}」で絞り込む`;

        classButton.addEventListener("click", () => {
          classFilter.value = video.class;
          updateTagFilter();
          currentPage = 1;
          renderVideos();

          window.scrollTo({
            top: 0,
            behavior: "smooth"
          });
        });

        card.appendChild(classButton);
      }

      // タグボタン
      const tagsContainer = document.createElement("div");
      tagsContainer.className = "tags";

      getVideoTags(video).forEach(tag => {
        const tagButton = document.createElement("button");
        tagButton.type = "button";
        tagButton.className = "tag";
        tagButton.textContent = tag;
        tagButton.title = `タグ「${tag}」で絞り込む`;

        tagButton.addEventListener("click", () => {
          const availableTags = [
            ...tagFilter.options
          ].map(option => option.value);

          // 選択中の分類にタグがない場合は全分類に戻す
          if (!availableTags.includes(tag)) {
            classFilter.value = "";
            updateTagFilter();
          }

          tagFilter.value = tag;
          currentPage = 1;
          renderVideos();

          window.scrollTo({
            top: 0,
            behavior: "smooth"
          });
        });

        tagsContainer.appendChild(tagButton);
      });

      card.appendChild(tagsContainer);

      // ページ内での埋め込み再生ボタン
      const playButton = document.createElement("button");
      playButton.type = "button";
      playButton.className = "play-button";
      playButton.textContent = "ページ内で再生";

      const playerContainer = document.createElement("div");
      playerContainer.className = "player";
      playerContainer.hidden = true;

      let iframe = null;

      playButton.addEventListener("click", () => {
        if (playerContainer.hidden) {
          playerContainer.hidden = false;

          if (!iframe) {
            iframe = document.createElement("iframe");
            iframe.src =
              `https://www.youtube-nocookie.com/embed/${encodeURIComponent(video.id)}?autoplay=1`;
            iframe.title = video.title || "YouTube動画";
            iframe.loading = "lazy";
            iframe.allow =
              "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
            iframe.referrerPolicy = "strict-origin-when-cross-origin";
            iframe.allowFullscreen = true;

            playerContainer.appendChild(iframe);
          }

          playButton.textContent = "プレーヤーを閉じる";
        } else {
          playerContainer.hidden = true;
          playButton.textContent = "ページ内で再生";
        }
      });

      card.appendChild(playButton);
      card.appendChild(playerContainer);

      return card;
    }

    // 検索結果を描画する
    function renderVideos() {
      const filteredVideos = getFilteredVideos();
      const totalVideos = filteredVideos.length;
      const totalPages = Math.max(
        1,
        Math.ceil(totalVideos / PAGE_SIZE)
      );

      // 検索条件の変更などでページ数を超えた場合に調整
      currentPage = Math.min(currentPage, totalPages);

      const startIndex = (currentPage - 1) * PAGE_SIZE;
      const pageVideos = filteredVideos.slice(
        startIndex,
        startIndex + PAGE_SIZE
      );

      videoList.replaceChildren();

      if (pageVideos.length === 0) {
        const message = document.createElement("div");
        message.className = "empty-message";
        message.textContent = "該当する動画がありません。";
        videoList.appendChild(message);
      } else {
        const fragment = document.createDocumentFragment();

        pageVideos.forEach(video => {
          fragment.appendChild(createVideoCard(video));
        });

        videoList.appendChild(fragment);
      }

      statusElement.textContent =
        `登録動画数：${videos.length.toLocaleString()}件 / ` +
        `検索結果：${totalVideos.toLocaleString()}件`;

      pageInfo.textContent = `${currentPage} / ${totalPages}`;

      prevButton.disabled = currentPage <= 1;
      nextButton.disabled = currentPage >= totalPages;
    }

    // CSVを読み込む
    async function loadVideos() {
      try {
        const response = await fetch("./videos.csv", {
          cache: "no-cache"
        });

        if (!response.ok) {
          throw new Error(
            `videos.csv の読み込みに失敗しました (${response.status})`
          );
        }

        const csvText = await response.text();

        const result = Papa.parse(csvText, {
          header: true,
          skipEmptyLines: "greedy",
          transformHeader: header => header.trim()
        });

        if (result.errors.length > 0) {
          console.warn("CSV読み込み時の警告:", result.errors);
        }

        const requiredColumns = ["title", "class", "tags", "id"];
        const headers = result.meta.fields || [];

        const missingColumns = requiredColumns.filter(
          column => !headers.includes(column)
        );

        if (missingColumns.length > 0) {
          throw new Error(
            "CSVに必要な列がありません: " +
            missingColumns.join(", ")
          );
        }

        videos = result.data
          .map(row => ({
            title: cleanValue(row.title),
            class: cleanValue(row.class),
            tags: cleanValue(row.tags),
            id: normalizeVideoId(row.id)
          }))
          .filter(video => video.title && video.id);

        buildFilters();
        currentPage = 1;
        renderVideos();
      } catch (error) {
        console.error(error);
        statusElement.textContent =
          "動画データを読み込めませんでした: " + error.message;
        videoList.replaceChildren();
      }
    }

    // キーワード検索
    keywordInput.addEventListener("input", () => {
      currentPage = 1;
      renderVideos();
    });

    // 分類変更時はタグ候補も更新する
    classFilter.addEventListener("change", () => {
      updateTagFilter();
      currentPage = 1;
      renderVideos();
    });

    // タグ検索
    tagFilter.addEventListener("change", () => {
      currentPage = 1;
      renderVideos();
    });

    // 検索条件のリセット
    resetButton.addEventListener("click", () => {
      keywordInput.value = "";
      classFilter.value = "";
      updateTagFilter();
      tagFilter.value = "";
      currentPage = 1;
      renderVideos();
    });

    // ページ移動
    prevButton.addEventListener("click", () => {
      if (currentPage > 1) {
        currentPage--;
        renderVideos();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }
    });

    nextButton.addEventListener("click", () => {
      const totalPages = Math.max(
        1,
        Math.ceil(getFilteredVideos().length / PAGE_SIZE)
      );

      if (currentPage < totalPages) {
        currentPage++;
        renderVideos();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }
    });

    loadVideos();
  </script>
</body>
</html>
