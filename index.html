
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube動画カタログ</title>

  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.5.3/papaparse.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    h1 {
      margin-top: 0;
    }

    .search-panel {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
      padding: 16px;
      background: #fff;
      border-radius: 8px;
    }

    .search-item {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    input,
    select,
    button {
      font: inherit;
    }

    input,
    select {
      width: 100%;
      min-height: 40px;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 5px;
      background: #fff;
    }

    button {
      cursor: pointer;
    }

    .reset-button {
      align-self: end;
      min-height: 40px;
      padding: 8px 14px;
      border: 0;
      border-radius: 5px;
      background: #333;
      color: #fff;
    }

    #status {
      margin: 16px 0;
      color: #555;
    }

    #video-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 18px;
      align-items: stretch;
    }

    .video-card {
      display: flex;
      flex-direction: column;
      min-width: 0;
      height: 100%;
      padding: 12px;
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 1px 4px #00000012;
    }

    .thumbnail-link {
      display: block;
      margin-bottom: 10px;
    }

    .thumbnail {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      border-radius: 5px;
      background: #ddd;
    }

    .video-title {
      margin: 0 0 10px;
      font-size: 16px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .video-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 8px;
    }

    .video-category,
    .video-class,
    .tag {
      padding: 5px 8px;
      border: 0;
      border-radius: 4px;
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    .video-category {
      background: #e3edff;
      color: #174ea6;
    }

    .video-class {
      background: #e5f5e9;
      color: #176534;
    }

    .tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin: 0 0 12px;
    }

    .tag {
      background: #eee;
      color: #333;
    }

    .video-category:hover,
    .video-class:hover,
    .tag:hover {
      filter: brightness(0.94);
    }

    .player-container {
      margin-bottom: 10px;
    }

    .player-container iframe {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      border: 0;
      border-radius: 5px;
    }

    .play-button {
      width: 100%;
      margin-top: auto;
      padding: 10px;
      border: 0;
      border-radius: 5px;
      background: #c00;
      color: #fff;
    }

    .play-button:hover {
      background: #a00;
    }

    #pagination {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin: 24px 0;
    }

    #pagination button {
      min-width: 40px;
      min-height: 38px;
      padding: 6px 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      background: #fff;
    }

    #pagination button:disabled {
      cursor: default;
      opacity: 0.45;
    }

    #pagination button.current-page {
      background: #333;
      color: #fff;
      border-color: #333;
    }

    .message {
      padding: 20px;
      background: #fff;
      border-radius: 8px;
      overflow-wrap: anywhere;
    }

    @media (max-width: 600px) {
      body {
        padding: 12px;
      }

      #video-list {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <h1>YouTube動画カタログ</h1>

  <div class="search-panel">
    <div class="search-item">
      <label for="keyword">キーワード検索</label>
      <input
        type="search"
        id="keyword"
        placeholder="タイトル・カテゴリー・class・タグ"
      >
    </div>

    <div class="search-item">
      <label for="category-filter">カテゴリー</label>
      <select id="category-filter">
        <option value="">すべてのカテゴリー</option>
      </select>
    </div>

    <div class="search-item">
      <label for="class-filter">class</label>
      <select id="class-filter">
        <option value="">すべてのclass</option>
      </select>
    </div>

    <div class="search-item">
      <label for="tag-filter">tag</label>
      <select id="tag-filter">
        <option value="">すべてのtag</option>
      </select>
    </div>

    <button type="button" id="reset-search" class="reset-button">
      検索条件をリセット
    </button>
  </div>

  <div id="status">CSVを読み込んでいます...</div>
  <div id="video-list"></div>
  <div id="pagination"></div>

  <script>
    "use strict";

    const PAGE_SIZE = 50;

    const keywordInput = document.getElementById("keyword");
    const categoryFilter = document.getElementById("category-filter");
    const classFilter = document.getElementById("class-filter");
    const tagFilter = document.getElementById("tag-filter");
    const resetButton = document.getElementById("reset-search");
    const statusElement = document.getElementById("status");
    const videoListElement = document.getElementById("video-list");
    const paginationElement = document.getElementById("pagination");

    let videos = [];
    let currentPage = 1;

    // YouTubeのURLまたは動画IDから動画IDを取得
    function normalizeVideoId(value) {
      const input = String(value ?? "").trim();

      if (!input) {
        return "";
      }

      if (/^[a-zA-Z0-9_-]{11}$/.test(input)) {
        return input;
      }

      try {
        const url = new URL(
          input.startsWith("http") ? input : "https://" + input
        );

        if (
          url.hostname === "youtu.be" ||
          url.hostname.endsWith(".youtu.be")
        ) {
          return url.pathname.split("/").filter(Boolean)[0] || "";
        }

        if (
          url.hostname.includes("youtube.com") ||
          url.hostname.includes("youtube-nocookie.com")
        ) {
          const queryId = url.searchParams.get("v");

          if (queryId) {
            return queryId;
          }

          const parts = url.pathname.split("/").filter(Boolean);
          const markerIndex = parts.findIndex(part =>
            ["embed", "shorts", "live"].includes(part)
          );

          if (markerIndex !== -1 && parts[markerIndex + 1]) {
            return parts[markerIndex + 1];
          }
        }
      } catch (error) {
        // 不正なURLは無効とする
      }

      return "";
    }

    // 重複を除去して日本語順で並べる
    function uniqueSorted(values) {
      return [...new Set(
        values
          .map(value => String(value ?? "").trim())
          .filter(Boolean)
      )].sort((a, b) => a.localeCompare(b, "ja"));
    }

    // 複数タグを配列にする。区切り文字は ; , 、 ，
    function splitTags(value) {
      return String(value ?? "")
        .split(/[;,、，]/)
        .map(tag => tag.trim())
        .filter(Boolean);
    }

    // HTMLエスケープ
    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[char]);
    }

    // プルダウンの選択肢を更新
    function addOptions(selectElement, values, defaultLabel) {
      selectElement.replaceChildren();

      const defaultOption = document.createElement("option");
      defaultOption.value = "";
      defaultOption.textContent = defaultLabel;
      selectElement.appendChild(defaultOption);

      values.forEach(value => {
        const option = document.createElement("option");
        option.value = value;
        option.textContent = value;
        selectElement.appendChild(option);
      });
    }

    // カテゴリーの選択肢を作成
    function buildFilters() {
      const categories = uniqueSorted(
        videos.map(video => video.category)
      );

      addOptions(
        categoryFilter,
        categories,
        "すべてのカテゴリー"
      );

      updateClassFilter();
    }

    // カテゴリーに該当するclassだけを表示
    function updateClassFilter() {
      const selectedCategory = categoryFilter.value;
      const previousClass = classFilter.value;

      const relevantVideos = videos.filter(video =>
        !selectedCategory || video.category === selectedCategory
      );

      const classes = uniqueSorted(
        relevantVideos.map(video => video.class)
      );

      addOptions(
        classFilter,
        classes,
        "すべてのclass"
      );

      // 現在のカテゴリーに存在するclassだけを維持
      if (classes.includes(previousClass)) {
        classFilter.value = previousClass;
      }

      // classを更新したらtagも更新
      updateTagFilter();
    }

    // カテゴリーとclassに該当するtagだけを表示
    function updateTagFilter() {
      const selectedCategory = categoryFilter.value;
      const selectedClass = classFilter.value;
      const previousTag = tagFilter.value;

      const relevantVideos = videos.filter(video => {
        const matchesCategory =
          !selectedCategory || video.category === selectedCategory;

        const matchesClass =
          !selectedClass || video.class === selectedClass;

        return matchesCategory && matchesClass;
      });

      const tags = uniqueSorted(
        relevantVideos.flatMap(video => video.tags)
      );

      addOptions(
        tagFilter,
        tags,
        "すべてのtag"
      );

      // 現在の条件に存在するtagだけを維持
      if (tags.includes(previousTag)) {
        tagFilter.value = previousTag;
      }
    }

    // 現在の検索条件に一致する動画を取得
    function getFilteredVideos() {
      const keyword = keywordInput.value
        .trim()
        .toLocaleLowerCase();

      const selectedCategory = categoryFilter.value;
      const selectedClass = classFilter.value;
      const selectedTag = tagFilter.value;

      return videos.filter(video => {
        const matchesKeyword =
          !keyword ||
          [
            video.title,
            video.category,
            video.class,
            ...video.tags
          ].some(value =>
            String(value).toLocaleLowerCase().includes(keyword)
          );

        const matchesCategory =
          !selectedCategory || video.category === selectedCategory;

        const matchesClass =
          !selectedClass || video.class === selectedClass;

        const matchesTag =
          !selectedTag || video.tags.includes(selectedTag);

        return (
          matchesKeyword &&
          matchesCategory &&
          matchesClass &&
          matchesTag
        );
      });
    }

    // 動画カードを作成
    function createVideoCard(video) {
      const card = document.createElement("article");
      card.className = "video-card";

      // サムネイル
      const thumbnailLink = document.createElement("a");
      thumbnailLink.className = "thumbnail-link";
      thumbnailLink.href =
        "https://www.youtube.com/watch?v=" +
        encodeURIComponent(video.id);
      thumbnailLink.target = "_blank";
      thumbnailLink.rel = "noopener noreferrer";
      thumbnailLink.setAttribute("aria-label", video.title);

      const thumbnail = document.createElement("img");
      thumbnail.className = "thumbnail";
      thumbnail.src =
        "https://i.ytimg.com/vi/" +
        encodeURIComponent(video.id) +
        "/hqdefault.jpg";
      thumbnail.alt = video.title;
      thumbnail.loading = "lazy";
      thumbnail.referrerPolicy = "strict-origin-when-cross-origin";

      thumbnailLink.appendChild(thumbnail);
      card.appendChild(thumbnailLink);

      // タイトル
      const title = document.createElement("h2");
      title.className = "video-title";
      title.textContent = video.title || "タイトルなし";
      card.appendChild(title);

      // カテゴリーとclass
      const meta = document.createElement("div");
      meta.className = "video-meta";

      if (video.category) {
        const categoryButton = document.createElement("button");
        categoryButton.type = "button";
        categoryButton.className = "video-category";
        categoryButton.textContent = video.category;
        categoryButton.title =
          `カテゴリー「${video.category}」で絞り込む`;

        categoryButton.addEventListener("click", () => {
          categoryFilter.value = video.category;
          updateClassFilter();
          currentPage = 1;
          renderVideos();
        });

        meta.appendChild(categoryButton);
      }

      if (video.class) {
        const classButton = document.createElement("button");
        classButton.type = "button";
        classButton.className = "video-class";
        classButton.textContent = video.class;
        classButton.title = `class「${video.class}」で絞り込む`;

        classButton.addEventListener("click", () => {
          // そのclassを含むカテゴリーが複数ある場合は、
          // 現在のカテゴリーを優先する
          const currentCategory = categoryFilter.value;

          const matchingVideos = videos.filter(item =>
            item.class === video.class &&
            (!currentCategory || item.category === currentCategory)
          );

          if (matchingVideos.length === 0) {
            categoryFilter.value = "";
          }

          updateClassFilter();

          if (
            [...classFilter.options].some(
              option => option.value === video.class
            )
          ) {
            classFilter.value = video.class;
          }

          updateTagFilter();
          currentPage = 1;
          renderVideos();
        });

        meta.appendChild(classButton);
      }

      card.appendChild(meta);

      // タグ
      if (video.tags.length > 0) {
        const tagList = document.createElement("div");
        tagList.className = "tag-list";

        video.tags.forEach(tag => {
          const tagButton = document.createElement("button");
          tagButton.type = "button";
          tagButton.className = "tag";
          tagButton.textContent = "#" + tag;
          tagButton.title = `tag「${tag}」で絞り込む`;

          tagButton.addEventListener("click", () => {
            const category = categoryFilter.value;
            const selectedClass = classFilter.value;

            const tagExistsInCurrentSelection = videos.some(item =>
              (!category || item.category === category) &&
              (!selectedClass || item.class === selectedClass) &&
              item.tags.includes(tag)
            );

            if (!tagExistsInCurrentSelection) {
              categoryFilter.value = "";
              classFilter.value = "";
              updateClassFilter();
            }

            tagFilter.value = tag;
            currentPage = 1;
            renderVideos();
          });

          tagList.appendChild(tagButton);
        });

        card.appendChild(tagList);
      }

      // ページ内プレイヤー
      const playerContainer = document.createElement("div");
      playerContainer.className = "player-container";
      playerContainer.hidden = true;
      card.appendChild(playerContainer);

      const playButton = document.createElement("button");
      playButton.type = "button";
      playButton.className = "play-button";
      playButton.textContent = "ページ内で再生";

      playButton.addEventListener("click", () => {
        if (playerContainer.hidden) {
          const iframe = document.createElement("iframe");

          iframe.src =
            "https://www.youtube-nocookie.com/embed/" +
            encodeURIComponent(video.id) +
            "?autoplay=1";

          iframe.title = video.title || "YouTube動画";
          iframe.loading = "lazy";
          iframe.allow =
            "accelerometer; autoplay; clipboard-write; encrypted-media; " +
            "gyroscope; picture-in-picture; web-share";
          iframe.referrerPolicy = "strict-origin-when-cross-origin";
          iframe.allowFullscreen = true;

          playerContainer.replaceChildren(iframe);
          playerContainer.hidden = false;
          playButton.textContent = "再生を閉じる";
        } else {
          playerContainer.replaceChildren();
          playerContainer.hidden = true;
          playButton.textContent = "ページ内で再生";
        }
      });

      card.appendChild(playButton);

      return card;
    }

    // ページネーションを作成
    function renderPagination(totalPages) {
      paginationElement.replaceChildren();

      if (totalPages <= 1) {
        return;
      }

      function addPageButton(
        label,
        page,
        disabled = false,
        current = false
      ) {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = label;
        button.disabled = disabled;

        if (current) {
          button.className = "current-page";
          button.setAttribute("aria-current", "page");
        }

        button.addEventListener("click", () => {
          currentPage = page;
          renderVideos();

          window.scrollTo({
            top: 0,
            behavior: "smooth"
          });
        });

        paginationElement.appendChild(button);
      }

      addPageButton("前へ", currentPage - 1, currentPage === 1);

      const startPage = Math.max(1, currentPage - 2);
      const endPage = Math.min(totalPages, currentPage + 2);

      if (startPage > 1) {
        addPageButton("1", 1, false, currentPage === 1);

        if (startPage > 2) {
          const dots = document.createElement("span");
          dots.textContent = "…";
          paginationElement.appendChild(dots);
        }
      }

      for (let page = startPage; page <= endPage; page++) {
        addPageButton(
          String(page),
          page,
          false,
          page === currentPage
        );
      }

      if (endPage < totalPages) {
        if (endPage < totalPages - 1) {
          const dots = document.createElement("span");
          dots.textContent = "…";
          paginationElement.appendChild(dots);
        }

        addPageButton(
          String(totalPages),
          totalPages,
          false,
          currentPage === totalPages
        );
      }

      addPageButton(
        "次へ",
        currentPage + 1,
        currentPage === totalPages
      );
    }

    // 動画一覧を描画
    function renderVideos() {
      const filteredVideos = getFilteredVideos();
      const totalVideos = filteredVideos.length;
      const totalPages = Math.ceil(totalVideos / PAGE_SIZE);

      if (totalPages === 0) {
        currentPage = 1;
      } else {
        currentPage = Math.min(
          Math.max(1, currentPage),
          totalPages
        );
      }

      const startIndex = (currentPage - 1) * PAGE_SIZE;
      const pageVideos = filteredVideos.slice(
        startIndex,
        startIndex + PAGE_SIZE
      );

      videoListElement.replaceChildren();

      if (pageVideos.length === 0) {
        const message = document.createElement("div");
        message.className = "message";
        message.textContent = "該当する動画がありません。";
        videoListElement.appendChild(message);
      } else {
        const fragment = document.createDocumentFragment();

        pageVideos.forEach(video => {
          fragment.appendChild(createVideoCard(video));
        });

        videoListElement.appendChild(fragment);
      }

      statusElement.textContent =
        `登録動画数：${videos.length.toLocaleString()}件 / ` +
        `検索結果：${totalVideos.toLocaleString()}件` +
        (totalPages > 0
          ? ` / ${currentPage}ページ目（全${totalPages}ページ）`
          : "");

      renderPagination(totalPages);
    }

    // CSVを読み込む
    async function loadVideos() {
      try {
        const response = await fetch("./videos.csv", {
          cache: "no-cache"
        });

        if (!response.ok) {
          throw new Error(
            `videos.csvの読み込みに失敗しました（HTTP ${response.status}）`
          );
        }

        const csvText = await response.text();

        const result = Papa.parse(csvText, {
          header: true,
          skipEmptyLines: "greedy",
          transformHeader: header => header.trim()
        });

        const requiredColumns = [
          "title",
          "category",
          "class",
          "tags",
          "id"
        ];

        const columns = result.meta.fields || [];
        const missingColumns = requiredColumns.filter(
          column => !columns.includes(column)
        );

        if (missingColumns.length > 0) {
          throw new Error(
            "CSVに必要な列がありません：" +
            missingColumns.join(", ") +
            "。ヘッダーを確認してください。"
          );
        }

        if (result.errors.length > 0) {
          console.warn(
            "CSVの読み込み時に警告があります：",
            result.errors
          );
        }

        videos = result.data
          .map(row => {
            const id = normalizeVideoId(row.id);

            return {
              title: String(row.title ?? "").trim(),
              category: String(row.category ?? "").trim(),
              class: String(row.class ?? "").trim(),
              tags: splitTags(row.tags),
              id
            };
          })
          .filter(video => video.id);

        buildFilters();
        renderVideos();
      } catch (error) {
        console.error(error);

        statusElement.textContent =
          "動画データの読み込みに失敗しました。";

        videoListElement.replaceChildren();

        const message = document.createElement("div");
        message.className = "message";
        message.textContent =
          error.message +
          " videos.csvの場所と列名を確認してください。";

        videoListElement.appendChild(message);
      }
    }

    // キーワード検索
    keywordInput.addEventListener("input", () => {
      currentPage = 1;
      renderVideos();
    });

    // カテゴリー変更時、classとtagを連動して更新
    categoryFilter.addEventListener("change", () => {
      updateClassFilter();
      currentPage = 1;
      renderVideos();
    });

    // class変更時、tagを連動して更新
    classFilter.addEventListener("change", () => {
      updateTagFilter();
      currentPage = 1;
      renderVideos();
    });

    // tag変更
    tagFilter.addEventListener("change", () => {
      currentPage = 1;
      renderVideos();
    });

    // 検索条件をリセット
    resetButton.addEventListener("click", () => {
      keywordInput.value = "";
      categoryFilter.value = "";
      classFilter.value = "";
      tagFilter.value = "";

      updateClassFilter();

      currentPage = 1;
      renderVideos();
    });

    loadVideos();
  </script>
</body>
</html>
